# Radiant monorepo: one moon project per module. Chapter 2: + the ETL, the MCP and the portal's Python client.
projects:
  backend: 'backend'
  frontend: 'frontend'
  etl: 'etl'
  mcp: 'mcp'
  python-client: 'clients/python'

vcs:
  defaultBranch: 'main'
  provider: 'github'

# Our modules are all applications that publish interfaces to each other
# (OpenAPI, later the StarRocks schema), so the default "app cannot depend on app" rule is off.
constraints:
  enforceLayerRelationships: false
