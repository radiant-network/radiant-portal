name: Cypress Nightly

on:
  schedule:
    - cron: '0 7 * * 1-5'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Cypress base URL'
        required: false
        default: 'https://portail.dev.qlin.aws.sante.quebec/'
      stop_only:
        description: 'Stop the nightly in progress without starting a new one'
        type: boolean
        default: false

jobs:
  cypress-nightly:
    runs-on: ubuntu-latest
    # On the job, not the workflow: a new nightly or a stop_only must not wait for publish-results below
    concurrency:
      group: cypress-nightly
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    outputs:
      run_id: ${{ steps.run.outputs.value }}

    steps:
      - uses: actions/checkout@v4

      # A spec that no shard lists would never run, without any warning
      - name: Check the shards cover every spec
        run: node cypress/scripts/check-shards.mjs

      - name: Set run ID
        id: run
        run: |
          RUN_ID="nightly-$(date +%Y%m%d-%H%M)"
          echo "value=${RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::311752058468:role/qlin-ferlease-cypress
          aws-region: ca-central-1

      - name: Stop the nightly in progress
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_CYPRESS_WEBHOOK }}
          LOCK_BUCKET: qlin-dev-cypress-artifacts
          LOCK_PREFIX: _locks/cypress-accounts/
          REASON: ${{ inputs.stop_only && format('Stopped on demand by {0}', github.actor) || 'Replaced by a new nightly' }}
        run: bash .github/scripts/stop-cypress-run.sh cypress-nightly "Radiant - Cypress run stopped ⏹️" "the nightly" "$REASON"

      - name: Upload source to S3
        if: ${{ !inputs.stop_only }}
        env:
          RUN_ID: ${{ steps.run.outputs.value }}
        run: |
          tar -czf /tmp/cypress-source.tar.gz \
            package.json package-lock.json \
            cypress/ cypress.config.ts tsconfig.json
          aws s3 cp /tmp/cypress-source.tar.gz \
            "s3://qlin-dev-cypress-artifacts/$RUN_ID/source.tar.gz"

      - name: Reserve a test account
        id: account
        if: ${{ !inputs.stop_only }}
        env:
          LOCK_BUCKET: qlin-dev-cypress-artifacts
          LOCK_PREFIX: _locks/cypress-accounts/
          ECS_CLUSTER: pipelines
          SLACK_WEBHOOK: ${{ secrets.SLACK_CYPRESS_WEBHOOK }}
          SLACK_TITLE: Radiant - Cypress
        run: |
          USERNAME=$(bash .github/scripts/cypress-account.sh reserve cypress-nightly)
          echo "username=$USERNAME" >> "$GITHUB_OUTPUT"

      - name: Notify Slack launch
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.stop_only }}
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_CYPRESS_WEBHOOK }}
          ACCOUNT: ${{ steps.account.outputs.username }}
        run: |
          curl -sf -X POST "$SLACK_WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d "{\"attachments\":[{\"title\":\"Radiant QA - Cypress Launch Attempt ⚙️\",\"text\":\"Cypress tests are starting ✈️ on QA (manual trigger), with the test account ${ACCOUNT}\",\"color\":\"good\"}]}" \
            || echo "Slack post failed"

      - name: Launch shards and aggregator
        if: ${{ !inputs.stop_only }}
        env:
          RUN_ID: ${{ steps.run.outputs.value }}
          CYPRESS_BASE_URL: ${{ inputs.base_url || 'https://portail.dev.qlin.aws.sante.quebec/' }}
          CYPRESS_USER_USERNAME: ${{ steps.account.outputs.username }}
          CYPRESS_USER_PASSWORD: ${{ secrets.CYPRESS_USER_PASSWORD }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_CYPRESS_WEBHOOK }}
        run: |
          SG_ID=$(aws ec2 describe-security-groups \
            --filters Name=group-name,Values=ferlease-cypress-task \
            --query 'SecurityGroups[0].GroupId' \
            --output text)
          # The proxy presigns a fresh URL on each click, so the Slack links outlive the task credentials
          PROXY_BASE=$(aws ssm get-parameter --region ca-central-1 --name /ferlease/cypress-proxy-url --query Parameter.Value --output text)

          # Balanced on the measured spec durations: about 21 min of tests per shard
          SHARDS=(
            "cypress/api/Cases/Autocomplete/*.cy.ts,cypress/api/Documents/*.cy.ts,cypress/api/Documents/DownloadUrl/*.cy.ts,cypress/api/Documents/Search/*.cy.ts,cypress/api/Patients/Batch/ProcessWorker/*.cy.ts,cypress/api/Sequencing/Batch/ProcessWorker/*.cy.ts,cypress/e2e/CaseEntity/Details/*.cy.ts,cypress/e2e/CaseEntity/Variants/Germline/CNV/QueryBuilder/*.cy.ts,cypress/e2e/CaseEntity/Variants/Somatic/SNV_TN/QueryBuilder/*.cy.ts,cypress/e2e/CaseEntity/Variants/Somatic/SNV_TN/SavedFilters/*.cy.ts,cypress/e2e/Connexion/*.cy.ts,cypress/e2e/Files/*.cy.ts,cypress/e2e/VariantEntity/EvidCond/*.cy.ts,cypress/e2e/VariantEntity/Patients/Filters/*.cy.ts"
            "cypress/api/Cases/Batch/*.cy.ts,cypress/api/Cases/Search/*.cy.ts,cypress/api/Documents/Autocomplete/*.cy.ts,cypress/api/Genes/Autocomplete/*.cy.ts,cypress/api/Occurrences/Somatic/SNV/List/*.cy.ts,cypress/api/Sequencing/Batch/*.cy.ts,cypress/api/Variants/**/*.cy.ts,cypress/e2e/CaseEntity/Variants/Germline/CNV/Facets/*.cy.ts,cypress/e2e/CaseEntity/Variants/Germline/CNV/Table/*.cy.ts,cypress/e2e/CaseEntity/Variants/Somatic/SNV_TN/Table/*.cy.ts,cypress/e2e/Cases/Filters/*.cy.ts,cypress/e2e/VariantEntity/Frequency/*.cy.ts,cypress/e2e/VariantEntity/Overview/*.cy.ts,cypress/e2e/VariantEntity/Patients/*.cy.ts"
            "cypress/api/Cases/*.cy.ts,cypress/api/Cases/AssignmentCandidates/*.cy.ts,cypress/api/Genes/Search/*.cy.ts,cypress/api/Hpo/**/*.cy.ts,cypress/api/Occurrences/Germline/SNV/List/*.cy.ts,cypress/api/Occurrences/Somatic/SNV/Count/*.cy.ts,cypress/api/Patients/Batch/*.cy.ts,cypress/api/Samples/Batch/ProcessWorker/*.cy.ts,cypress/e2e/CaseEntity/Files/**/*.cy.ts,cypress/e2e/CaseEntity/Variants/Germline/SNV/Facets/*.cy.ts,cypress/e2e/CaseEntity/Variants/Germline/SNV/FavoriteFacets/*.cy.ts,cypress/e2e/CaseEntity/Variants/Germline/SNV/QueryBuilder/*.cy.ts,cypress/e2e/CaseEntity/Variants/Germline/SNV/SavedFilters/*.cy.ts,cypress/e2e/CaseEntity/Variants/Germline/SNV/Table/*.cy.ts"
            "cypress/api/Batches/*.cy.ts,cypress/api/Cases/Documents/*.cy.ts,cypress/api/Mondo/**/*.cy.ts,cypress/api/Occurrences/Germline/CNV/**/*.cy.ts,cypress/api/Occurrences/Germline/SNV/Count/*.cy.ts,cypress/api/Samples/Batch/*.cy.ts,cypress/e2e/CaseEntity/Variants/Germline/CNV/IGV/*.cy.ts,cypress/e2e/CaseEntity/Variants/Germline/CNV/OverlappingGenes/*.cy.ts,cypress/e2e/CaseEntity/Variants/Germline/CNV/SavedFilters/*.cy.ts,cypress/e2e/CaseEntity/Variants/Germline/SNV/IGV/*.cy.ts,cypress/e2e/CaseEntity/Variants/Somatic/SNV_TN/Facets/*.cy.ts,cypress/e2e/CaseEntity/Variants/Somatic/SNV_TO/**/*.cy.ts,cypress/e2e/Cases/*.cy.ts,cypress/e2e/Files/Filters/*.cy.ts"
          )

          NIGHTLY_SHARD_CMD='
          set -e
          # Node.js security release of 2026-10-21: the container must run a patched version
          echo "Node.js $(node --version)"
          node -e "const [a,b,c]=process.versions.node.split(\".\").map(Number);process.exit(a>26||(a===26&&(b>12||(b===12&&c>=1)))?0:1)" || { echo "Node.js $(node --version) is not patched (>= v26.12.1 required)"; exit 1; }
          S3_PREFIX="s3://qlin-dev-cypress-artifacts/$RELEASE/shards/$SHARD_ID"
          aws s3 cp "s3://qlin-dev-cypress-artifacts/$RELEASE/source.tar.gz" /tmp/source.tar.gz
          mkdir -p /app && tar -xzf /tmp/source.tar.gz -C /app
          cd /app && npm ci
          npm install --no-save mochawesome mochawesome-merge mochawesome-report-generator cypress-multi-reporters mocha-junit-reporter
          mkdir -p cypress/results cypress/screenshots
          node -e "process.stdout.write(JSON.stringify({reporterEnabled:\"mochawesome,mocha-junit-reporter\",mochawesomeReporterOptions:{reportDir:\"cypress/results\",overwrite:false,html:false,json:true},mochaJunitReporterReporterOptions:{mochaFile:\"cypress/results/results-[hash].xml\"}}))" > /tmp/reporters-config.json
          set +e
          npx cypress run ${CYPRESS_SPEC:+--spec "$CYPRESS_SPEC"} --reporter cypress-multi-reporters --reporter-options "configFile=/tmp/reporters-config.json"
          CYPRESS_EXIT=$?
          set -e
          REPORT_URL=""
          FAIL_COUNT=0
          if compgen -G "cypress/results/*.json" > /dev/null 2>&1; then
            npx mochawesome-merge cypress/results/*.json -o /tmp/mochawesome.json
            npx marge /tmp/mochawesome.json --reportDir /tmp/html-report --inline --charts
            aws s3 cp /tmp/html-report/mochawesome.html "$S3_PREFIX/report.html" --content-type text/html
            aws s3 cp /tmp/mochawesome.json "$S3_PREFIX/mochawesome.json"
            REPORT_URL=$(aws s3 presign "$S3_PREFIX/report.html" --expires-in 86400)
            FAIL_COUNT=$(node -e "let d=\"\";process.stdin.on(\"data\",c=>d+=c);process.stdin.on(\"end\",()=>{try{process.stdout.write(String(JSON.parse(d).stats.failures||0))}catch(e){process.stdout.write(\"0\")}})" < /tmp/mochawesome.json 2>/dev/null || echo 0)
          fi
          if compgen -G "cypress/results/*.xml" > /dev/null 2>&1; then
            node -e "const fs=require(\"fs\");const files=process.argv.slice(1).filter(f=>fs.existsSync(f));const suites=files.flatMap(f=>{const c=fs.readFileSync(f,\"utf8\");const w=[...c.matchAll(/<testsuite(?!s)[\\s\\S]*?<\\/testsuite>/g)].map(m=>m[0]);const s=[...c.matchAll(/<testsuite(?!s)[^>]*\\/>/g)].map(m=>m[0].replace(/\\/>/,\"><\\/testsuite>\"));return [...w,...s];});if(suites.length)fs.writeFileSync(\"/tmp/results.xml\",\"<testsuites>\\n\"+suites.join(\"\\n\")+\"\\n</testsuites>\");" cypress/results/*.xml
            aws s3 cp /tmp/results.xml "$S3_PREFIX/results.xml" --content-disposition "attachment; filename=results.xml"
          fi
          fail_count=$(find cypress/screenshots -name "*.png" 2>/dev/null | wc -l | tr -d " ")
          SURL=""
          if [ "$fail_count" -gt 0 ]; then
            zip -r /tmp/screenshots.zip cypress/screenshots/
            aws s3 cp /tmp/screenshots.zip "$S3_PREFIX/screenshots.zip"
            SURL=$(aws s3 presign "$S3_PREFIX/screenshots.zip" --expires-in 86400)
          fi
          printf "{\"exit_code\":%s,\"report_url\":\"%s\",\"screenshots_url\":\"%s\",\"failure_count\":%s}" "$CYPRESS_EXIT" "$REPORT_URL" "$SURL" "$FAIL_COUNT" > /tmp/result.json
          aws s3 cp /tmp/result.json "$S3_PREFIX/result.json"
          exit $CYPRESS_EXIT
          '

          TASK_ARNS=()
          for i in "${!SHARDS[@]}"; do
            OVERRIDES=$(jq -cn \
              --arg release "$RUN_ID" \
              --arg base_url "$CYPRESS_BASE_URL" \
              --arg username "$CYPRESS_USER_USERNAME" \
              --arg password "$CYPRESS_USER_PASSWORD" \
              --arg spec "${SHARDS[$i]}" \
              --arg shard_id "$i" \
              --arg cmd "$NIGHTLY_SHARD_CMD" \
              '{containerOverrides:[{name:"ferlease-cypress",command:[$cmd],environment:[
                {name:"RELEASE",value:$release},
                {name:"CYPRESS_BASE_URL",value:$base_url},
                {name:"CYPRESS_USER_USERNAME",value:$username},
                {name:"CYPRESS_USER_PASSWORD",value:$password},
                {name:"CYPRESS_SPEC",value:$spec},
                {name:"SHARD_ID",value:$shard_id}
              ]}]}')

            ARN=$(aws ecs run-task \
              --cluster pipelines \
              --task-definition ferlease-cypress \
              --launch-type FARGATE \
              --network-configuration "awsvpcConfiguration={subnets=[subnet-07cac0f9ab50d76ed,subnet-0be9fa70291f7c86c],assignPublicIp=DISABLED,securityGroups=[$SG_ID]}" \
              --overrides "$OVERRIDES" \
              --started-by cypress-nightly \
              --query 'tasks[0].taskArn' \
              --output text)
            TASK_ARNS+=("$ARN")
            echo "Shard $i launched: $ARN"
          done

          AGGREGATOR_CMD='
          set -e
          # Frees the test account however the aggregator ends, so the next run can take it at once
          release_account() { [ "$(aws s3 cp "$ACCOUNT_LOCK" - 2>/dev/null | cut -d " " -f1)" = "$RUN_KEY" ] && aws s3 rm "$ACCOUNT_LOCK" > /dev/null; true; }
          trap release_account EXIT
          ARNS=($SHARD_TASK_ARNS)
          SHARDS_COUNT=$SHARD_COUNT
          while true; do
            RUNNING=$(aws ecs describe-tasks --cluster pipelines --tasks "${ARNS[@]}" --query "length(tasks[?lastStatus!=\`STOPPED\`])" --output text)
            [ "$RUNNING" = "0" ] && break
            sleep 60
          done
          ALL_PASSED=true
          mkdir -p /tmp/all_screenshots
          for i in $(seq 0 $((SHARDS_COUNT - 1))); do
            R=$(aws s3 cp "s3://qlin-dev-cypress-artifacts/$RELEASE/shards/$i/result.json" - 2>/dev/null || echo "{\"exit_code\":1,\"failure_count\":0}")
            EC=$(echo "$R" | node -e "let d=\"\";process.stdin.on(\"data\",c=>d+=c);process.stdin.on(\"end\",()=>{try{process.stdout.write(String(JSON.parse(d).exit_code||0))}catch(e){process.stdout.write(\"1\")}})" 2>/dev/null || echo 1)
            [ "$EC" != "0" ] && ALL_PASSED=false
            aws s3 cp "s3://qlin-dev-cypress-artifacts/$RELEASE/shards/$i/screenshots.zip" "/tmp/shard_${i}.zip" 2>/dev/null || true
            [ -f "/tmp/shard_${i}.zip" ] && unzip -oq "/tmp/shard_${i}.zip" -d /tmp/all_screenshots/ 2>/dev/null || true
            aws s3 cp "s3://qlin-dev-cypress-artifacts/$RELEASE/shards/$i/results.xml" "/tmp/shard_${i}.xml" 2>/dev/null || true
            aws s3 cp "s3://qlin-dev-cypress-artifacts/$RELEASE/shards/$i/mochawesome.json" "/tmp/shard_${i}_moch.json" 2>/dev/null || true
          done
          # Retries=2 (defaut) generates "(attempt 3)" images and known fails are tagged "SJRA-", "CLIN-" or "RAD-"
          attemptMax=3
          NEW_FAILS=$(find /tmp/all_screenshots -type f -name "*.png" 2>/dev/null | grep -F -e "(attempt ${attemptMax})" -e "before all hook (failed)" | grep -v -e "SJRA-" -e "CLIN-" -e "RAD-" | wc -l | tr -d " ")
          NEW_FAILS=${NEW_FAILS:-0}
          TOTAL_FAILS=$(find /tmp/all_screenshots -type f -name "*.png" 2>/dev/null | grep -F -e "(attempt ${attemptMax})" -e "before all hook (failed)" | wc -l | tr -d " ")
          TOTAL_FAILS=${TOTAL_FAILS:-0}
          COMBINED_ZURL=""
          if [ -n "$(ls -A /tmp/all_screenshots/ 2>/dev/null)" ]; then
            cd /tmp && zip -rq combined_screenshots.zip all_screenshots/
            aws s3 cp /tmp/combined_screenshots.zip "s3://qlin-dev-cypress-artifacts/$RELEASE/combined_screenshots.zip"
            COMBINED_ZURL="${PROXY_BASE}/?key=$RELEASE/combined_screenshots.zip"
          fi
          COMBINED_XURL=""
          XML_PARTS=()
          for i in $(seq 0 $((SHARDS_COUNT - 1))); do
            [ -f "/tmp/shard_${i}.xml" ] && XML_PARTS+=("/tmp/shard_${i}.xml")
          done
          if [ ${#XML_PARTS[@]} -gt 0 ]; then
            node -e "const fs=require(\"fs\");const files=process.argv.slice(1).filter(f=>fs.existsSync(f));const suites=files.flatMap(f=>{const c=fs.readFileSync(f,\"utf8\");const w=[...c.matchAll(/<testsuite(?!s)[\\s\\S]*?<\\/testsuite>/g)].map(m=>m[0]);const s=[...c.matchAll(/<testsuite(?!s)[^>]*\\/>/g)].map(m=>m[0].replace(/\\/>/,\"><\\/testsuite>\"));return [...w,...s];});if(suites.length)fs.writeFileSync(\"/tmp/combined-results.xml\",\"<testsuites>\\n\"+suites.join(\"\\n\")+\"\\n</testsuites>\");" "${XML_PARTS[@]}"
            if [ -f /tmp/combined-results.xml ]; then
              aws s3 cp /tmp/combined-results.xml "s3://qlin-dev-cypress-artifacts/$RELEASE/combined-results.xml" --content-disposition "attachment; filename=combined-results.xml"
              COMBINED_XURL="${PROXY_BASE}/?key=$RELEASE/combined-results.xml"
            fi
          fi
          COMBINED_RURL=""
          MOCH_PARTS=()
          for i in $(seq 0 $((SHARDS_COUNT - 1))); do
            [ -f "/tmp/shard_${i}_moch.json" ] && MOCH_PARTS+=("/tmp/shard_${i}_moch.json")
          done
          if [ ${#MOCH_PARTS[@]} -gt 0 ]; then
            npm install --no-save mochawesome-merge mochawesome-report-generator 2>/dev/null || true
            npx mochawesome-merge "${MOCH_PARTS[@]}" -o /tmp/combined-mochawesome.json 2>/dev/null || true
            if [ -f /tmp/combined-mochawesome.json ]; then
              npx marge /tmp/combined-mochawesome.json --reportDir /tmp/combined-html --reportFilename mochawesome --inline --charts 2>/dev/null || true
              if [ -f /tmp/combined-html/mochawesome.html ]; then
                aws s3 cp /tmp/combined-html/mochawesome.html "s3://qlin-dev-cypress-artifacts/$RELEASE/combined-report.html" --content-type text/html
                COMBINED_RURL="${PROXY_BASE}/?key=$RELEASE/combined-report.html"
              fi
            fi
          fi
          $ALL_PASSED && STATUS="All passed ✅" || { [ "$NEW_FAILS" -gt 0 ] && STATUS="${NEW_FAILS} new fails 🐛 (${TOTAL_FAILS} total fails)" || { [ "$TOTAL_FAILS" -gt 0 ] && STATUS="${NEW_FAILS} new fails 🆗 (${TOTAL_FAILS} total fails)" || STATUS="Failed 💥"; }; }
          if $ALL_PASSED; then
            COLOR="good"
          elif [ "$NEW_FAILS" -eq 0 ] && [ "$TOTAL_FAILS" -gt 0 ]; then
            COLOR="good"
          else
            COLOR="danger"
          fi
          TITLE="Radiant - Cypress Test Results: $STATUS"
          BODY_PARTS=()
          [ -n "$COMBINED_ZURL" ] && BODY_PARTS+=("Download all screenshots as a zip file: <${COMBINED_ZURL}|Download>")
          [ -n "$COMBINED_RURL" ] && BODY_PARTS+=("Report HTML: <${COMBINED_RURL}|View Report>")
          [ -n "$COMBINED_XURL" ] && BODY_PARTS+=("Report XML: <${COMBINED_XURL}|View Results>")
          BODY_PARTS+=("Test account: $ACCOUNT")
          TEXT=$(printf "%s\n" "${BODY_PARTS[@]}")
          PAYLOAD=$(node -e "process.stdout.write(JSON.stringify({attachments:[{title:process.argv[1],text:process.argv[2],color:process.argv[3]}]}))" "$TITLE" "$TEXT" "$COLOR")
          curl -sf -X POST "$SLACK_WEBHOOK" -H "Content-Type: application/json" -d "$PAYLOAD" || true
          '

          AGG_OVERRIDES=$(jq -cn \
            --arg release "$RUN_ID" \
            --arg slack "$SLACK_WEBHOOK" \
            --arg arns "${TASK_ARNS[*]}" \
            --arg count "${#TASK_ARNS[@]}" \
            --arg cmd "$AGGREGATOR_CMD" \
            --arg proxy_base "$PROXY_BASE" \
            --arg account "$CYPRESS_USER_USERNAME" \
            --arg account_lock "s3://qlin-dev-cypress-artifacts/_locks/cypress-accounts/$CYPRESS_USER_USERNAME" \
            '{containerOverrides:[{name:"ferlease-cypress",command:[$cmd],environment:[
              {name:"RELEASE",value:$release},
              {name:"SLACK_WEBHOOK",value:$slack},
              {name:"SHARD_TASK_ARNS",value:$arns},
              {name:"SHARD_COUNT",value:$count},
              {name:"PROXY_BASE",value:$proxy_base},
              {name:"RUN_KEY",value:"cypress-nightly"},
              {name:"ACCOUNT",value:$account},
              {name:"ACCOUNT_LOCK",value:$account_lock}
            ]}]}')

          aws ecs run-task \
            --cluster pipelines \
            --task-definition ferlease-cypress \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[subnet-07cac0f9ab50d76ed,subnet-0be9fa70291f7c86c],assignPublicIp=DISABLED,securityGroups=[$SG_ID]}" \
            --overrides "$AGG_OVERRIDES" \
            --started-by cypress-nightly/aggregator \
            --query 'tasks[0].taskArn' \
            --output text | xargs -I{} echo "Aggregator launched: {}"

  # The shards and the aggregator run on ECS after the job above has ended. This job waits for the
  # aggregator, then attaches its JUnit report to the run, where the test dashboard
  # (Ferlab-Ste-Justine/test-dashboard) fetches it without any access to AWS.
  publish-results:
    needs: cypress-nightly
    if: ${{ !inputs.stop_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::311752058468:role/qlin-ferlease-cypress
          aws-region: ca-central-1

      - name: Wait for the aggregator
        env:
          RUN_ID: ${{ needs.cypress-nightly.outputs.run_id }}
        run: |
          # The aggregator of this run, while it has not stopped. A newer nightly may have stopped it.
          running_aggregator() {
            local arns
            arns=$(aws ecs list-tasks --cluster pipelines --started-by cypress-nightly/aggregator --query 'taskArns' --output text)
            if [ -z "$arns" ] || [ "$arns" = "None" ]; then
              return 0
            fi
            # shellcheck disable=SC2086
            aws ecs describe-tasks --cluster pipelines --tasks $arns --output json \
              | jq -r --arg run "$RUN_ID" '.tasks[] | select(any(.overrides.containerOverrides[].environment[]?; .name == "RELEASE" and .value == $run)) | .taskArn'
          }
          while true; do
            AGGREGATOR=$(running_aggregator)
            [ -z "$AGGREGATOR" ] && break
            sleep 60
          done

      # The credentials last 1 h, and the wait above takes most of it
      - name: Renew AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::311752058468:role/qlin-ferlease-cypress
          aws-region: ca-central-1

      - name: Fetch the JUnit report
        id: report
        env:
          RUN_ID: ${{ needs.cypress-nightly.outputs.run_id }}
          BASE_URL: ${{ inputs.base_url || 'https://portail.dev.qlin.aws.sante.quebec/' }}
        run: |
          mkdir -p cypress-results
          if aws s3 cp "s3://qlin-dev-cypress-artifacts/$RUN_ID/combined-results.xml" cypress-results/results.xml; then
            jq -n --arg run_id "$RUN_ID" --arg sha "$GITHUB_SHA" --arg base_url "$BASE_URL" \
              '{run_id: $run_id, sha: $sha, base_url: $base_url}' > cypress-results/run.json
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No JUnit report for $RUN_ID: the run was stopped, or no shard produced results"
          fi

      - name: Attach the report to the run
        if: ${{ steps.report.outputs.found == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: cypress-junit
          path: cypress-results/
          retention-days: 30
