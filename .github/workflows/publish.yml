# POC only, never run: replaces the build_and_push*.yml and release.yml of the three repos.
name: Publish
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'     # weekly full rebuild: base-image fixes reach every image (and QA)

# One run at a time: the <sha>-<ts> timestamp must grow with the commits, or Flux deploys an older image.
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io/radiant-network
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - run: npm install -g @moonrepo/cli@2.6.2
      # Built images get sha-<short> + <sha>-<ts> (Flux redeploys them in QA);
      # the others only get sha-<short>, a registry-side retag Flux ignores.
      - if: github.event_name == 'push'
        run: scripts/publish.sh ${{ github.event.before }} ${{ github.sha }}
      - if: github.event_name == 'schedule'
        run: scripts/publish.sh --all

  release-please:
    needs: publish            # the release commit's image set exists before it is promoted
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      # A GitHub App token: a release PR opened with GITHUB_TOKEN runs no check.
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
      # One product release: release-please-config.json at the root, one package ".", tags v<version>.
      - id: rp
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token }}

  promote:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io/radiant-network
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - run: npm install -g @moonrepo/cli@2.6.2
      # No rebuild: v<version> points at the digests QA has been running.
      - run: scripts/promote.sh ${{ github.sha }} ${{ needs.release-please.outputs.version }}
