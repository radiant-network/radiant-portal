            "cypress/api/Batches/InvalidUUID.cy.ts,cypress/api/Cases/Batch/BlankFields_OptionalDiveFields.cy.ts,cypress/api/Cases/Batch/Forbidden.cy.ts,cypress/api/Cases/Batch/Valid.cy.ts,cypress/api/Documents/Autocomplete/Name.cy.ts,cypress/api/Genes/Search/EnsemblId.cy.ts,cypress/api/Occurrences/Germline/SNV/Count/Gene.cy.ts,cypress/api/Occurrences/Somatic/SNV/List/Paging.cy.ts,cypress/api/Patients/Batch/InvalidValues_EnumFields.cy.ts,cypress/api/Patients/Batch/MissingFields_DateOfBirth.cy.ts,cypress/api/Patients/Batch/MissingFields_OptionalFields.cy.ts,cypress/api/Patients/Batch/NullFields_DateOfBirth.cy.ts,cypress/api/Patients/Batch/Valid.cy.ts,cypress/api/Samples/Batch/NullFields_OptionalFields.cy.ts,cypress/e2e/CaseEntity/Files/Columns.cy.ts,cypress/e2e/CaseEntity/Variants/Germline/CNV/Facets/ApplyResults.cy.ts,cypress/e2e/CaseEntity/Variants/Germline/CNV/Facets/Dictionary.cy.ts,cypress/e2e/CaseEntity/Variants/Germline/CNV/Facets/UploadList.cy.ts,cypress/e2e/CaseEntity/Variants/Germline/CNV/QueryBuilder/TwoPills.cy.ts,cypress/e2e/CaseEntity/Variants/Germline/CNV/SavedFilters/Manager.cy.ts,cypress/e2e/CaseEntity/Variants/Germline/SNV/IGV/FromTable.cy.ts,cypress/e2e/CaseEntity/Variants/Germline/SNV/QueryBuilder/OnePill.cy.ts,cypress/e2e/CaseEntity/Variants/Germline/SNV/QueryBuilder/TwoQueries.cy.ts,cypress/e2e/CaseEntity/Variants/Somatic/SNV_TN/Table/InformationDisplayed.cy.ts,cypress/e2e/Cases/ActionButtons.cy.ts,cypress/e2e/Files/Filters/RequestValidation.cy.ts,cypress/e2e/Files/Hyperlinks.cy.ts,cypress/e2e/Files/RequestValidation.cy.ts,cypress/e2e/VariantEntity/EvidCond/CondPhen_Hpo_Columns.cy.ts,cypress/e2e/VariantEntity/EvidCond/CondPhen_Hpo_Sort.cy.ts,cypress/e2e/VariantEntity/Frequency/PublicCohorts_InformationDisplayed.cy.ts,cypress/e2e/VariantEntity/Overview/Interpretation_Hyperlinks.cy.ts,cypress/e2e/VariantEntity/Overview/Interpretation_InformationDisplayed.cy.ts,cypress/e2e/VariantEntity/Patients/Filters/Configuration.cy.ts"
