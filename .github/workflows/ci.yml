# POC only, never run (local tour: `moon ci` is what this job executes). Replaces the portal's backend.yml, the ETL's test.yml and the MCP's test.yml.
name: CI
on:
  pull_request:
    # edited: a new title re-runs contracts-breaking (the title declares the product bump)
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [0, 1]      # moon splits the affected targets across jobs
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # moon needs the merge base to compute "affected"
      - uses: actions/setup-go@v6
        with: { go-version: '1.27', cache-dependency-path: backend/go.sum }
      - uses: actions/setup-node@v6
        with: { node-version-file: .nvmrc, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true }
      - run: npm install -g @moonrepo/cli@2.6.2
      # Only tasks whose inputs changed between the PR base and HEAD,
      # plus the tasks that depend on them (e.g. swagger.yaml -> frontend:api-client-check).
      - run: moon ci --job ${{ matrix.shard }} --job-total 2
        env:
          # contracts-breaking: the bump the contracts need <= the bump the title declares (none on a push)
          CONTRACTS_BASE: origin/${{ github.base_ref || 'main' }}
          CONTRACTS_PR_TITLE: ${{ github.event.pull_request.title }}
          CONTRACTS_PR_BODY: ${{ github.event.pull_request.body }}
