# Owned by the ETL: the source of truth for this table. Change it in the same PR as the DDL (moon run etl:contracts-check).
apiVersion: v3.2.0
kind: DataContract
id: radiant.starrocks.tenant.somatic__cnv__variant_frequency
name: somatic__cnv__variant_frequency
version: 0.1.0
status: draft
domain: genomics
dataProduct: radiant-starrocks
description:
  purpose: 'One row per distinct somatic CNV interval (cnv_id) of the tenant, with the number and fraction of patients
    whose tumor (tumor-only analyses) carries a matching CNV, split by WGS and WXS. Fully recomputed per tenant
    by the ETL (RAD-120); read by the portal somatic CNV endpoints (somatic_p*_to_* fields).

    '
  usage: 'Per-tenant table, key cnv_id. LEFT JOIN on somatic__cnv__occurrence.cnv_id. The portal exposes the columns
    with a somatic_ prefix (pf_to_wgs -> somatic_pf_to_wgs).

    '
  limitations: 'Tumor-only cohort only (_to_); tumor-normal (_tn_) columns will be added when tumor-normal CNVs
    are ingested. Empty for a tenant without tumor-only tasks. Same non-transitive per-interval matching as the
    germline table.

    '
team:
- username: radiant-etl
  role: producer
- username: radiant-portal
  role: consumer
servers:
- server: starrocks
  type: mysql
  host: starrocks
  port: 9030
  database: '{tenant}_tenant'
schema:
- name: somatic__cnv__variant_frequency
  physicalName: somatic__cnv__variant_frequency
  physicalType: table
  tags:
  - per-tenant
  properties:
  - name: cnv_id
    logicalType: integer
    physicalType: BIGINT
    description: CNV interval (GET_CNV_ID of chromosome, start, length, type), one row per distinct cnv_id of somatic__cnv__occurrence
      in the tenant. Join key to somatic__cnv__occurrence.cnv_id.
    customProperties:
    - property: descriptionSource
      value: etl:dags/sql/radiant/somatic_cnv_variant_frequency_insert.sql; hub:docs/features/RAD-120-cnv-cohort-frequency.md
    required: true
    unique: true
  - name: pc_to_wgs
    logicalType: integer
    physicalType: BIGINT
    description: Number of distinct patients with a tumor-only WGS task whose tumor carries at least one PASS CNV
      matching this interval (same chromosome, same class with GAIN and GAINLOH pooled, overlap >= 80% of each length).
      0 when none.
    customProperties:
    - property: descriptionSource
      value: etl:dags/sql/radiant/somatic_cnv_variant_frequency_insert.sql; hub:docs/features/RAD-120-cnv-cohort-frequency.md
  - name: pn_to_wgs
    logicalType: integer
    physicalType: BIGINT
    description: Number of distinct patients with at least one somatic CNV occurrence from a tumor-only WGS task
      (one tumoral and no normal aliquot), whatever its filter. Same value on every row.
    customProperties:
    - property: descriptionSource
      value: etl:dags/sql/radiant/somatic_cnv_variant_frequency_insert.sql; hub:docs/features/RAD-120-cnv-cohort-frequency.md
  - name: pf_to_wgs
    logicalType: number
    physicalType: DOUBLE
    description: pc_to_wgs / pn_to_wgs, carrier frequency of the interval in the tumor-only WGS cohort. NULL when
      pn_to_wgs is 0.
    customProperties:
    - property: unit
      value: ratio 0-1
    - property: descriptionSource
      value: etl:dags/sql/radiant/somatic_cnv_variant_frequency_insert.sql; hub:docs/features/RAD-120-cnv-cohort-frequency.md
  - name: pc_to_wxs
    logicalType: integer
    physicalType: BIGINT
    description: Number of distinct patients with a tumor-only WXS (exome) task whose tumor carries at least one
      PASS CNV matching this interval (same chromosome, same class with GAIN and GAINLOH pooled, overlap >= 80%
      of each length). 0 when none.
    customProperties:
    - property: descriptionSource
      value: etl:dags/sql/radiant/somatic_cnv_variant_frequency_insert.sql; hub:docs/features/RAD-120-cnv-cohort-frequency.md
  - name: pn_to_wxs
    logicalType: integer
    physicalType: BIGINT
    description: Number of distinct patients with at least one somatic CNV occurrence from a tumor-only WXS (exome)
      task (one tumoral and no normal aliquot), whatever its filter. Same value on every row.
    customProperties:
    - property: descriptionSource
      value: etl:dags/sql/radiant/somatic_cnv_variant_frequency_insert.sql; hub:docs/features/RAD-120-cnv-cohort-frequency.md
  - name: pf_to_wxs
    logicalType: number
    physicalType: DOUBLE
    description: pc_to_wxs / pn_to_wxs, carrier frequency of the interval in the tumor-only WXS (exome) cohort.
      NULL when pn_to_wxs is 0.
    customProperties:
    - property: unit
      value: ratio 0-1
    - property: descriptionSource
      value: etl:dags/sql/radiant/somatic_cnv_variant_frequency_insert.sql; hub:docs/features/RAD-120-cnv-cohort-frequency.md
  quality:
  - name: somatic_cnv_variant_frequency__should_not_be_empty
    metric: rowCount
    mustBeGreaterThan: 0
    dimension: completeness
  - name: somatic_cnv_variant_frequency__should_be_within_range_pf
    type: sql
    dimension: accuracy
    description: pf_to_wgs, pf_to_wxs stay within [0, 1] (NULL allowed).
    query: SELECT COUNT(*) FROM somatic__cnv__variant_frequency WHERE pf_to_wgs < 0 OR pf_to_wgs > 1 OR pf_to_wxs
      < 0 OR pf_to_wxs > 1
    mustBe: 0
  - name: somatic_cnv_variant_frequency__validate_occurrence_coverage
    type: sql
    description: Every interval of the occurrences gets a frequency row, also when none of its CNVs passes the filter.
      With the uniqueness of `cnv_id` on the frequency table, each occurrence joins to exactly one row. A row here
      means the frequency table is older than the occurrences (the recompute after the occurrence insert failed
      or was skipped) or the insert dropped intervals.
    query: SELECT COUNT(*) FROM (select distinct o.cnv_id from somatic__cnv__occurrence o left join somatic__cnv__variant_frequency
      f on f.cnv_id = o.cnv_id where f.cnv_id is null) failing
    mustBe: 0
    authoritativeDefinitions:
    - type: implementation
      url: radiant-portal-pipeline:radiant/data_qa/tests/somatic_cnv_variant_frequency__validate_occurrence_coverage.sql
  - name: somatic_cnv_variant_frequency__validate_pc_lte_pn
    type: sql
    description: '`pc` counts the patients carrying a matching CNV, `pn` the patients with any tumor-only CNV occurrence,
      so `pc` can never exceed `pn`. A row here means a cohort mismatch between the counts and the denominators
      in somatic_cnv_variant_frequency_insert.sql.'
    query: SELECT COUNT(*) FROM (select cnv_id, pc_to_wgs, pn_to_wgs, pc_to_wxs, pn_to_wxs from somatic__cnv__variant_frequency
      where pc_to_wgs > pn_to_wgs or pc_to_wxs > pn_to_wxs) failing
    mustBe: 0
    authoritativeDefinitions:
    - type: implementation
      url: radiant-portal-pipeline:radiant/data_qa/tests/somatic_cnv_variant_frequency__validate_pc_lte_pn.sql
  customProperties:
  - property: distributedBy
    value: DISTRIBUTED BY HASH(`cnv_id`) BUCKETS 10
  - property: consumers
    value:
    - portal/backend/internal/types/somatic_cnv_occurrence.go
authoritativeDefinitions:
- type: ddl
  url: radiant-portal-pipeline:radiant/dags/sql/radiant/init/somatic_cnv_variant_frequency_create_table.sql
- type: dataQuality
  url: radiant-portal-pipeline:radiant/data_qa/sources/somatic_cnv_variant_frequency.yml
