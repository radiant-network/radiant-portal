    - property: descriptionSource
      value: etl:dags/sql/radiant/migrations/RAD-206_germline_cnv_occurrence_add_inheritance.sql; etl:tasks/vcf/cnv/germline/occurrence.py
  - name: father_name
    logicalType: string
    physicalType: varchar(1048576)
    description: The father's own DRAGEN call ID (FORMAT/OID), equal to name on his alignment-task row; NULL for
      a slivar VCF made before FORMAT/OID. Filled on the proband rows of a radiant_germline_cnv_annotation task
      only (slivar CNV set); NULL on alignment-task rows, for parents and solo cases.
    customProperties:
    - property: descriptionSource
