  quality:
  - name: germline_cnv_occurrence__should_not_be_empty
    metric: rowCount
    mustBeGreaterThan: 0
    dimension: completeness
  - name: germline_cnv_occurrence__should_not_contain_only_null
    type: sql
    dimension: completeness
    description: No column is entirely NULL (except ciend, cipos, cnv_id, part, svlen, task_id).
    query: SELECT (CASE WHEN COUNT(seq_id) = 0 THEN 1 ELSE 0 END) + (CASE WHEN COUNT(aliquot) = 0 THEN 1 ELSE 0
      END) + (CASE WHEN COUNT(chromosome) = 0 THEN 1 ELSE 0 END) + (CASE WHEN COUNT(alternate) = 0 THEN 1 ELSE 0
      END) + (CASE WHEN COUNT(start) = 0 THEN 1 ELSE 0 END) + (CASE WHEN COUNT(end) = 0 THEN 1 ELSE 0 END) + (CASE
      WHEN COUNT(type) = 0 THEN 1 ELSE 0 END) + (CASE WHEN COUNT(length) = 0 THEN 1 ELSE 0 END) + (CASE WHEN COUNT(name)
      = 0 THEN 1 ELSE 0 END) + (CASE WHEN COUNT(quality) = 0 THEN 1 ELSE 0 END) + (CASE WHEN COUNT(calls) = 0 THEN
      1 ELSE 0 END) + (CASE WHEN COUNT(filter) = 0 THEN 1 ELSE 0 END) + (CASE WHEN COUNT(bc) = 0 THEN 1 ELSE 0 END)
      + (CASE WHEN COUNT(cn) = 0 THEN 1 ELSE 0 END) + (CASE WHEN COUNT(pe) = 0 THEN 1 ELSE 0 END) + (CASE WHEN COUNT(sm)
      = 0 THEN 1 ELSE 0 END) + (CASE WHEN COUNT(svtype) = 0 THEN 1 ELSE 0 END) + (CASE WHEN COUNT(reflen) = 0 THEN
      1 ELSE 0 END) + (CASE WHEN COUNT(phased) = 0 THEN 1 ELSE 0 END) + (CASE WHEN COUNT(cytoband) = 0 THEN 1 ELSE
      0 END) + (CASE WHEN COUNT(symbol) = 0 THEN 1 ELSE 0 END) + (CASE WHEN COUNT(nb_genes) = 0 THEN 1 ELSE 0 END)
      + (CASE WHEN COUNT(nb_snv) = 0 THEN 1 ELSE 0 END) + (CASE WHEN COUNT(gnomad_af) = 0 THEN 1 ELSE 0 END) + (CASE
      WHEN COUNT(gnomad_sc) = 0 THEN 1 ELSE 0 END) + (CASE WHEN COUNT(gnomad_sn) = 0 THEN 1 ELSE 0 END) + (CASE
      WHEN COUNT(gnomad_sf) = 0 THEN 1 ELSE 0 END) + (CASE WHEN COUNT(gnomad_sc_hom) = 0 THEN 1 ELSE 0 END) + (CASE
      WHEN COUNT(gnomad_sc_het) = 0 THEN 1 ELSE 0 END) + (CASE WHEN COUNT(gnomad_ac) = 0 THEN 1 ELSE 0 END) FROM
      germline__cnv__occurrence
    mustBe: 0
  - name: germline_cnv_occurrence__should_not_contain_same_value
    type: sql
    dimension: accuracy
    description: No scalar column holds a single constant value (except part, phased, svtype).
    query: SELECT (CASE WHEN COUNT(DISTINCT seq_id) <= 1 THEN 1 ELSE 0 END) + (CASE WHEN COUNT(DISTINCT task_id)
      <= 1 THEN 1 ELSE 0 END) + (CASE WHEN COUNT(DISTINCT cnv_id) <= 1 THEN 1 ELSE 0 END) + (CASE WHEN COUNT(DISTINCT
      aliquot) <= 1 THEN 1 ELSE 0 END) + (CASE WHEN COUNT(DISTINCT chromosome) <= 1 THEN 1 ELSE 0 END) + (CASE WHEN
      COUNT(DISTINCT alternate) <= 1 THEN 1 ELSE 0 END) + (CASE WHEN COUNT(DISTINCT start) <= 1 THEN 1 ELSE 0 END)
      + (CASE WHEN COUNT(DISTINCT end) <= 1 THEN 1 ELSE 0 END) + (CASE WHEN COUNT(DISTINCT type) <= 1 THEN 1 ELSE
      0 END) + (CASE WHEN COUNT(DISTINCT length) <= 1 THEN 1 ELSE 0 END) + (CASE WHEN COUNT(DISTINCT name) <= 1
      THEN 1 ELSE 0 END) + (CASE WHEN COUNT(DISTINCT quality) <= 1 THEN 1 ELSE 0 END) + (CASE WHEN COUNT(DISTINCT
      filter) <= 1 THEN 1 ELSE 0 END) + (CASE WHEN COUNT(DISTINCT bc) <= 1 THEN 1 ELSE 0 END) + (CASE WHEN COUNT(DISTINCT
      cn) <= 1 THEN 1 ELSE 0 END) + (CASE WHEN COUNT(DISTINCT sm) <= 1 THEN 1 ELSE 0 END) + (CASE WHEN COUNT(DISTINCT
      svlen) <= 1 THEN 1 ELSE 0 END) + (CASE WHEN COUNT(DISTINCT reflen) <= 1 THEN 1 ELSE 0 END) + (CASE WHEN COUNT(DISTINCT
      nb_genes) <= 1 THEN 1 ELSE 0 END) + (CASE WHEN COUNT(DISTINCT nb_snv) <= 1 THEN 1 ELSE 0 END) + (CASE WHEN
      COUNT(DISTINCT gnomad_af) <= 1 THEN 1 ELSE 0 END) + (CASE WHEN COUNT(DISTINCT gnomad_sc) <= 1 THEN 1 ELSE
      0 END) + (CASE WHEN COUNT(DISTINCT gnomad_sn) <= 1 THEN 1 ELSE 0 END) + (CASE WHEN COUNT(DISTINCT gnomad_sf)
      <= 1 THEN 1 ELSE 0 END) + (CASE WHEN COUNT(DISTINCT gnomad_sc_hom) <= 1 THEN 1 ELSE 0 END) + (CASE WHEN COUNT(DISTINCT
      gnomad_sc_het) <= 1 THEN 1 ELSE 0 END) + (CASE WHEN COUNT(DISTINCT gnomad_ac) <= 1 THEN 1 ELSE 0 END) FROM
      germline__cnv__occurrence
    mustBe: 0
  - name: germline_cnv_occurrence__should_be_within_range_gnomad_af
    type: sql
    dimension: accuracy
    description: gnomad_af stay within [0, 1] (NULL allowed).
    query: SELECT COUNT(*) FROM germline__cnv__occurrence WHERE gnomad_af < 0 OR gnomad_af > 1
    mustBe: 0
  - name: germline_cnv_occurrence__should_be_within_range_gnomad_sf
    type: sql
    dimension: accuracy
    description: gnomad_sf stay within [0, 1] (NULL allowed).
    query: SELECT COUNT(*) FROM germline__cnv__occurrence WHERE gnomad_sf < 0 OR gnomad_sf > 1
    mustBe: 0
  - name: germline_cnv_occurrence__should_be_unique__part_seq_id_task_id_cnv_id
    metric: duplicateValues
    arguments:
      properties:
      - part
      - seq_id
      - task_id
      - cnv_id
    mustBe: 0
    dimension: uniqueness
    description: (part, seq_id, task_id, cnv_id) is unique.
  - name: germline_cnv_occurrence__validate_start_end_order
    type: sql
    description: 'Genomic coordinate sanity for germline CNV occurrences: - start must not exceed end (1-based inclusive
      span).'
    query: SELECT COUNT(*) FROM (select cnv_id, chromosome, start, `end` from germline__cnv__occurrence where start
      > `end`) failing
    mustBe: 0
    authoritativeDefinitions:
    - type: implementation
      url: radiant-portal-pipeline:radiant/data_qa/tests/germline_cnv_occurrence__validate_start_end_order.sql
