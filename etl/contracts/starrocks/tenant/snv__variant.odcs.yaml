# Owned by the ETL: the source of truth for this table. Change it in the same PR as the DDL (moon run etl:contracts-check).
apiVersion: v3.2.0
kind: DataContract
id: radiant.starrocks.tenant.snv__variant
name: snv__variant
version: 0.1.0
status: draft
domain: genomics
dataProduct: radiant-starrocks
description:
  purpose: 'One row per SNV/indel locus that has at least one germline or somatic SNV occurrence in the tenant (per-tenant
    database): picked VEP annotation, open-data annotations (gnomAD, TOPMed, 1000 Genomes, ClinVar, dbSNP, OMIM,
    COSMIC CMC) and the tenant''s germline and somatic frequencies. Rebuilt in full (INSERT OVERWRITE) by the ETL
    (import_part after each import, reannotate_open_data) from radiant.snv__staging_variant joined with the tenant''s
    frequency tables. Read by the portal backend; the MCP reads the per-variant_part copy snv__variant_partitioned
    instead.'
  usage: 'Key: locus_id (unique). Join occurrences (germline__snv__occurrence, somatic__snv__occurrence) on locus_id;
    prefer this table over snv__variant_partitioned for cohort-wide queries since it holds one row per locus. The
    annotation is that of one picked consequence per variant: the VEP PICK=1 transcript, else the first canonical
    one. Other transcripts and the in-silico scores (dbNSFP, SpliceAI, gnomAD constraint) are not here but in snv__consequence
    / snv__consequence_filter_partitioned. Open-data columns are joined on locus_id (exact allele) from the shared
    radiant database when radiant.snv__staging_variant is built, and refreshed by reannotate_open_data. '
  limitations: 'Frequency columns (pc, pn, pf, hom, af) are COALESCEd to 0, never NULL; open-data columns are NULL
    when the allele is absent from the source. gnomad_v3_af is misnamed: it holds gnomAD 4.1 joint AF with the contract
    open-data tables. clinvar_name holds the ClinVar Variation ID, not a name. germline_af_* / somatic_af_* are
    diploid approximations. rsnumber keeps a single rs id when dbSNP lists several for the locus (snv__staging_variant
    is keyed on locus_id). '
team:
- username: radiant-etl
  role: producer
- username: radiant-portal
  role: consumer
- username: radiant-mcp
  role: consumer
servers:
- server: starrocks
  type: mysql
  host: starrocks
  port: 9030
  database: '{tenant}_tenant'
schema:
- name: snv__variant
  physicalName: snv__variant
  physicalType: table
  tags:
  - per-tenant
  properties:
  - name: locus_id
    logicalType: integer
    physicalType: BIGINT
    description: 'Variant identifier: the GET_VARIANT_ID UDF encoding of (chromosome, start, reference, alternate),
      or, for alleles the UDF cannot encode, the id held for the locus_hash in radiant.variant_lookup. Same key
      as the occurrence, consequence and open-data tables; unique in snv__variant.'
    customProperties:
    - property: descriptionSource
      value: etl:dags/sql/radiant/snv_tmp_variant_insert.sql; etl:dags/sql/radiant/init/variant_id_udf.sql; etl:data_qa/sources/snv_variant.yml
    required: true
    unique: true
  - name: germline_pf_wgs
    logicalType: number
    physicalType: DOUBLE
    description: 'Patient (carrier) frequency in the tenant: germline_pc_wgs / germline_pn_wgs; 0 when the denominator
      is 0. Labelled in the portal as the patient frequency across the network (WGS).'
    customProperties:
    - property: unit
      value: ratio 0-1
    - property: descriptionSource
      value: etl:dags/sql/radiant/germline_snv_staging_variant_freq_insert.sql; etl:dags/sql/radiant/germline_snv_variant_frequency_insert.sql;
        etl:dags/sql/radiant/snv_variant_insert.sql; frontend:translations/common/en.json
  - name: germline_pf_wxs
    logicalType: number
    physicalType: DOUBLE
    description: 'Patient (carrier) frequency in the tenant: germline_pc_wxs / germline_pn_wxs; 0 when the denominator
      is 0. Labelled in the portal as the patient frequency across the network (WXS (exome)).'
    customProperties:
