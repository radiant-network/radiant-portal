      = 0 THEN 1 ELSE 0 END) + (CASE WHEN COUNT(germline_pf_wxs_affected) = 0 THEN 1 ELSE 0 END) + (CASE WHEN COUNT(germline_pc_wxs_not_affected)
      = 0 THEN 1 ELSE 0 END) + (CASE WHEN COUNT(germline_pn_wxs_not_affected) = 0 THEN 1 ELSE 0 END) + (CASE WHEN
      COUNT(germline_pf_wxs_not_affected) = 0 THEN 1 ELSE 0 END) + (CASE WHEN COUNT(somatic_pc_tn_wgs) = 0 THEN
      1 ELSE 0 END) + (CASE WHEN COUNT(somatic_pn_tn_wgs) = 0 THEN 1 ELSE 0 END) + (CASE WHEN COUNT(somatic_pc_tn_wxs)
