      = 0 THEN 1 ELSE 0 END) + (CASE WHEN COUNT(cmc_sample_ratio) = 0 THEN 1 ELSE 0 END) + (CASE WHEN COUNT(cmc_tier)
      = 0 THEN 1 ELSE 0 END) + (CASE WHEN COUNT(germline_hom_wgs) = 0 THEN 1 ELSE 0 END) + (CASE WHEN COUNT(germline_af_wgs)
      = 0 THEN 1 ELSE 0 END) + (CASE WHEN COUNT(germline_hom_wgs_affected) = 0 THEN 1 ELSE 0 END) + (CASE WHEN COUNT(germline_af_wgs_affected)
      = 0 THEN 1 ELSE 0 END) + (CASE WHEN COUNT(germline_hom_wgs_not_affected) = 0 THEN 1 ELSE 0 END) + (CASE WHEN
