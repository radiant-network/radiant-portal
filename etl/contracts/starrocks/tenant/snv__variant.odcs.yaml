  - name: snv_variant__should_not_contain_same_value_RAD-177
    type: sql
    dimension: accuracy
    description: No scalar column holds a single constant value (except germline_af_wxs, germline_af_wxs_affected,
      germline_af_wxs_not_affected, germline_hom_wxs, germline_hom_wxs_affected, germline_hom_wxs_not_affected,
      germline_pc_wxs, germline_pc_wxs_affected, germline_pc_wxs_not_affected, germline_pf_wxs, germline_pf_wxs_affected,
      germline_pf_wxs_not_affected, germline_pn_wgs, germline_pn_wgs_affected, germline_pn_wgs_not_affected, germline_pn_wxs,
      germline_pn_wxs_affected, germline_pn_wxs_not_affected, locus, locus_id, pick_source, somatic_af_tn_wxs, somatic_af_to_wgs,
      somatic_af_to_wxs, somatic_hom_tn_wgs, somatic_hom_tn_wxs, somatic_hom_to_wgs, somatic_hom_to_wxs, somatic_pc_tn_wxs,
      somatic_pc_to_wgs, somatic_pc_to_wxs, somatic_pf_tn_wxs, somatic_pf_to_wgs, somatic_pf_to_wxs, somatic_pn_tn_wgs,
      somatic_pn_tn_wxs, somatic_pn_to_wgs, somatic_pn_to_wxs).
    query: SELECT (CASE WHEN COUNT(DISTINCT germline_pf_wgs) <= 1 THEN 1 ELSE 0 END) + (CASE WHEN COUNT(DISTINCT
      somatic_pf_tn_wgs) <= 1 THEN 1 ELSE 0 END) + (CASE WHEN COUNT(DISTINCT gnomad_v3_af) <= 1 THEN 1 ELSE 0 END)
      + (CASE WHEN COUNT(DISTINCT topmed_af) <= 1 THEN 1 ELSE 0 END) + (CASE WHEN COUNT(DISTINCT tg_af) <= 1 THEN
      1 ELSE 0 END) + (CASE WHEN COUNT(DISTINCT germline_pc_wgs) <= 1 THEN 1 ELSE 0 END) + (CASE WHEN COUNT(DISTINCT
      germline_pc_wgs_affected) <= 1 THEN 1 ELSE 0 END) + (CASE WHEN COUNT(DISTINCT germline_pf_wgs_affected) <=
      1 THEN 1 ELSE 0 END) + (CASE WHEN COUNT(DISTINCT germline_pc_wgs_not_affected) <= 1 THEN 1 ELSE 0 END) + (CASE
      WHEN COUNT(DISTINCT germline_pf_wgs_not_affected) <= 1 THEN 1 ELSE 0 END) + (CASE WHEN COUNT(DISTINCT somatic_pc_tn_wgs)
      <= 1 THEN 1 ELSE 0 END) + (CASE WHEN COUNT(DISTINCT chromosome) <= 1 THEN 1 ELSE 0 END) + (CASE WHEN COUNT(DISTINCT
      start) <= 1 THEN 1 ELSE 0 END) + (CASE WHEN COUNT(DISTINCT end) <= 1 THEN 1 ELSE 0 END) + (CASE WHEN COUNT(DISTINCT
      clinvar_name) <= 1 THEN 1 ELSE 0 END) + (CASE WHEN COUNT(DISTINCT variant_class) <= 1 THEN 1 ELSE 0 END) +
      (CASE WHEN COUNT(DISTINCT symbol) <= 1 THEN 1 ELSE 0 END) + (CASE WHEN COUNT(DISTINCT impact_score) <= 1 THEN
      1 ELSE 0 END) + (CASE WHEN COUNT(DISTINCT vep_impact) <= 1 THEN 1 ELSE 0 END) + (CASE WHEN COUNT(DISTINCT
      is_mane_select) <= 1 THEN 1 ELSE 0 END) + (CASE WHEN COUNT(DISTINCT is_mane_plus) <= 1 THEN 1 ELSE 0 END)
      + (CASE WHEN COUNT(DISTINCT is_canonical) <= 1 THEN 1 ELSE 0 END) + (CASE WHEN COUNT(DISTINCT rsnumber) <=
      1 THEN 1 ELSE 0 END) + (CASE WHEN COUNT(DISTINCT reference) <= 1 THEN 1 ELSE 0 END) + (CASE WHEN COUNT(DISTINCT
      alternate) <= 1 THEN 1 ELSE 0 END) + (CASE WHEN COUNT(DISTINCT mane_select) <= 1 THEN 1 ELSE 0 END) + (CASE
      WHEN COUNT(DISTINCT hgvsg) <= 1 THEN 1 ELSE 0 END) + (CASE WHEN COUNT(DISTINCT hgvsc) <= 1 THEN 1 ELSE 0 END)
      + (CASE WHEN COUNT(DISTINCT hgvsp) <= 1 THEN 1 ELSE 0 END) + (CASE WHEN COUNT(DISTINCT dna_change) <= 1 THEN
      1 ELSE 0 END) + (CASE WHEN COUNT(DISTINCT aa_change) <= 1 THEN 1 ELSE 0 END) + (CASE WHEN COUNT(DISTINCT transcript_id)
      <= 1 THEN 1 ELSE 0 END) + (CASE WHEN COUNT(DISTINCT cmc_mutation_url) <= 1 THEN 1 ELSE 0 END) + (CASE WHEN
      COUNT(DISTINCT cmc_sample_mutated) <= 1 THEN 1 ELSE 0 END) + (CASE WHEN COUNT(DISTINCT cmc_sample_ratio) <=
      1 THEN 1 ELSE 0 END) + (CASE WHEN COUNT(DISTINCT cmc_tier) <= 1 THEN 1 ELSE 0 END) + (CASE WHEN COUNT(DISTINCT
      germline_hom_wgs) <= 1 THEN 1 ELSE 0 END) + (CASE WHEN COUNT(DISTINCT germline_af_wgs) <= 1 THEN 1 ELSE 0
      END) + (CASE WHEN COUNT(DISTINCT germline_hom_wgs_affected) <= 1 THEN 1 ELSE 0 END) + (CASE WHEN COUNT(DISTINCT
      germline_af_wgs_affected) <= 1 THEN 1 ELSE 0 END) + (CASE WHEN COUNT(DISTINCT germline_hom_wgs_not_affected)
      <= 1 THEN 1 ELSE 0 END) + (CASE WHEN COUNT(DISTINCT germline_af_wgs_not_affected) <= 1 THEN 1 ELSE 0 END)
      + (CASE WHEN COUNT(DISTINCT somatic_af_tn_wgs) <= 1 THEN 1 ELSE 0 END) FROM snv__variant
    mustBe: 0
  - name: snv_variant__should_be_within_range_pf
    type: sql
    dimension: accuracy
    description: germline_pf_wgs, germline_pf_wxs, somatic_pf_tn_wgs, somatic_pf_tn_wxs, somatic_pf_to_wgs, somatic_pf_to_wxs,
      germline_pf_wgs_affected, germline_pf_wgs_not_affected, germline_pf_wxs_affected, germline_pf_wxs_not_affected
      stay within [0, 1] (NULL allowed).
    query: SELECT COUNT(*) FROM snv__variant WHERE germline_pf_wgs < 0 OR germline_pf_wgs > 1 OR germline_pf_wxs
      < 0 OR germline_pf_wxs > 1 OR somatic_pf_tn_wgs < 0 OR somatic_pf_tn_wgs > 1 OR somatic_pf_tn_wxs < 0 OR somatic_pf_tn_wxs
      > 1 OR somatic_pf_to_wgs < 0 OR somatic_pf_to_wgs > 1 OR somatic_pf_to_wxs < 0 OR somatic_pf_to_wxs > 1 OR
      germline_pf_wgs_affected < 0 OR germline_pf_wgs_affected > 1 OR germline_pf_wgs_not_affected < 0 OR germline_pf_wgs_not_affected
      > 1 OR germline_pf_wxs_affected < 0 OR germline_pf_wxs_affected > 1 OR germline_pf_wxs_not_affected < 0 OR
      germline_pf_wxs_not_affected > 1
    mustBe: 0
  - name: snv_variant__should_be_within_range_cmc_sample_ratio
    type: sql
    dimension: accuracy
    description: cmc_sample_ratio stay within [0, 1] (NULL allowed).
    query: SELECT COUNT(*) FROM snv__variant WHERE cmc_sample_ratio < 0 OR cmc_sample_ratio > 1
    mustBe: 0
  - name: snv_variant__should_be_within_range_af
    type: sql
    dimension: accuracy
    description: germline_af_wgs, germline_af_wgs_affected, germline_af_wgs_not_affected, germline_af_wxs, germline_af_wxs_affected,
      germline_af_wxs_not_affected, somatic_af_tn_wgs, somatic_af_tn_wxs, somatic_af_to_wgs, somatic_af_to_wxs stay
      within [0, 1] (NULL allowed).
    query: SELECT COUNT(*) FROM snv__variant WHERE germline_af_wgs < 0 OR germline_af_wgs > 1 OR germline_af_wgs_affected
      < 0 OR germline_af_wgs_affected > 1 OR germline_af_wgs_not_affected < 0 OR germline_af_wgs_not_affected >
      1 OR germline_af_wxs < 0 OR germline_af_wxs > 1 OR germline_af_wxs_affected < 0 OR germline_af_wxs_affected
      > 1 OR germline_af_wxs_not_affected < 0 OR germline_af_wxs_not_affected > 1 OR somatic_af_tn_wgs < 0 OR somatic_af_tn_wgs
      > 1 OR somatic_af_tn_wxs < 0 OR somatic_af_tn_wxs > 1 OR somatic_af_to_wgs < 0 OR somatic_af_to_wgs > 1 OR
      somatic_af_to_wxs < 0 OR somatic_af_to_wxs > 1
    mustBe: 0
  - name: snv_variant__validate_hom_lte_pc
    type: sql
    description: '`hom` counts the carriers called HOM or HEM among the `pc` carriers, with the same filters and
      cohorts, so it can never exceed `pc`. A row here means the hom and pc counts drifted apart (filter or cohort
      mismatch in the *_snv_staging_variant_freq_insert.sql queries) or a column swap in the positional snv_variant_insert.sql.'
    query: SELECT COUNT(*) FROM (select locus_id, germline_pc_wgs, germline_hom_wgs, germline_pc_wxs, germline_hom_wxs,
      somatic_pc_tn_wgs, somatic_hom_tn_wgs, somatic_pc_to_wgs, somatic_hom_to_wgs from snv__variant where germline_hom_wgs
      > germline_pc_wgs or germline_hom_wgs_affected > germline_pc_wgs_affected or germline_hom_wgs_not_affected
      > germline_pc_wgs_not_affected or germline_hom_wxs > germline_pc_wxs or germline_hom_wxs_affected > germline_pc_wxs_affected
      or germline_hom_wxs_not_affected > germline_pc_wxs_not_affected or somatic_hom_tn_wgs > somatic_pc_tn_wgs
      or somatic_hom_tn_wxs > somatic_pc_tn_wxs or somatic_hom_to_wgs > somatic_pc_to_wgs or somatic_hom_to_wxs
      > somatic_pc_to_wxs) failing
    mustBe: 0
    authoritativeDefinitions:
    - type: implementation
      url: radiant-portal-pipeline:radiant/data_qa/tests/snv_variant__validate_hom_lte_pc.sql
  - name: snv_variant__validate_no_star_alternate
    type: sql
    description: '`*` in `alternate` is the spanning-deletion placeholder (VCF artifact), expected to be filtered
      out upstream — this table should contain none.'
    query: SELECT COUNT(*) FROM (select locus_id, chromosome, start, reference, alternate from snv__variant where
      alternate = '*') failing
    mustBe: 0
    authoritativeDefinitions:
    - type: implementation
      url: radiant-portal-pipeline:radiant/data_qa/tests/snv_variant__validate_no_star_alternate.sql
