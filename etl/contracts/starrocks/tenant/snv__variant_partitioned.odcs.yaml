      value: etl:tasks/vcf/snv/common.py; etl:data_qa/macros/dictionaries.sql dict_chromosome
  - name: start
    logicalType: integer
    physicalType: BIGINT
    description: 1-based position of the variant (VCF POS, after normalisation and multi-allelic splitting upstream).
    customProperties:
    - property: descriptionSource
      value: etl:tasks/vcf/snv/common.py; etl:data_qa/sources/snv_variant.yml
  - name: end
    logicalType: integer
    physicalType: BIGINT
    description: '1-based inclusive end of the reference allele (cyvcf2 Variant.end: start + length(reference) -
      1, or INFO/END when present).'
    customProperties:
    - property: descriptionSource
      value: etl:tasks/vcf/snv/common.py; upstream:cyvcf2 Variant.end
  - name: clinvar_name
    logicalType: string
    physicalType: VARCHAR(2000)
    description: 'ClinVar Variation ID of this allele (radiant.clinvar.name, joined on locus_id), not a human-readable
      name: the portal links it as https://www.ncbi.nlm.nih.gov/clinvar/variation/<clinvar_name> and joins it to
      clinvar_rcv.clinvar_id. NULL when the allele is not in ClinVar.'
    customProperties:
    - property: descriptionSource
      value: etl:dags/sql/radiant/snv_staging_variant_insert.sql; frontend:apps/variant/src/entity/overview/external-references-card.tsx;
        portal:internal/repository/starrocks/clinvar_rcv.go
  - name: variant_class
    logicalType: string
    physicalType: VARCHAR(50)
    description: 'VEP VARIANT_CLASS (Sequence Ontology class) of the picked consequence: SNV, insertion, deletion,
      indel, substitution or sequence_alteration.'
    customProperties:
    - property: descriptionSource
      value: etl:tasks/vcf/snv/consequence.py; etl:tasks/vcf/snv/variant.py; etl:data_qa/macros/dictionaries.sql
        dict_variant_class
    enum:
    - value: insertion
    - value: deletion
    - value: SNV
    - value: indel
    - value: substitution
    - value: sequence_alteration
  - name: clinvar_interpretation
    logicalType: array
    physicalType: ARRAY<VARCHAR(100)>
    description: ClinVar clinical significance terms of the allele (radiant.clinvar.interpretations, joined on locus_id),
      spelled as in ClinVar with underscores, e.g. Pathogenic, Likely_benign, Conflicting_classifications_of_pathogenicity.
      NULL when not in ClinVar.
    customProperties:
    - property: descriptionSource
      value: etl:dags/sql/radiant/snv_staging_variant_insert.sql; etl:data_qa/macros/dictionaries.sql dict_clinvar_interpretation;
        upstream:clinvar CLNSIG
    items:
      name: clinvar_interpretation_item
      logicalType: string
      physicalType: VARCHAR(100)
      enum:
      - value: Affects
      - value: association_not_found
      - value: association
      - value: Benign
      - value: confers_sensitivity
      - value: Conflicting_classifications_of_pathogenicity
      - value: conflicting_data_from_submitters
      - value: Conflicting_interpretations_of_pathogenicity
      - value: drug_response
      - value: Established_risk_allele
      - value: Likely_benign
      - value: likely_pathogenic_low_penetrance
      - value: Likely_pathogenic
      - value: Likely_risk_allele
      - value: no_classification_for_the_single_variant
      - value: no_classifications_from_unflagged_records
      - value: not_provided
      - value: other
      - value: pathogenic_low_penetrance
      - value: Pathogenic
      - value: protective
      - value: risk_factor
      - value: Uncertain_risk_allele
      - value: Uncertain_significance
      - value: VUS-high
      - value: VUS-low
      - value: VUS-mid
      - value: _low_penetrance
      - value: low_penetrance
      - value: Likely_pathogenic_low_penetrance
      - value: Pathogenic_low_penetrance
  - name: symbol
    logicalType: string
    physicalType: VARCHAR(100)
    description: Gene symbol (VEP SYMBOL) of the picked consequence. HGNC/Ensembl names for an Ensembl pick; NCBI
      names (LOC..., readthroughs) possible when pick_source = 'RefSeq'. NULL or empty when the pick has no gene
      (intergenic).
    customProperties:
    - property: descriptionSource
      value: etl:tasks/vcf/snv/consequence.py; etl:tasks/vcf/snv/variant.py; etl:data_qa/sources/snv_variant.yml
  - name: impact_score
    logicalType: integer
    physicalType: tinyint
    description: 'Numeric rank of vep_impact, for sorting: HIGH 4, MODERATE 3, LOW 2, MODIFIER 1 (0 if the impact
      is missing).'
    customProperties:
    - property: descriptionSource
      value: etl:tasks/vcf/snv/consequence.py IMPACT_SCORE
  - name: consequences
    logicalType: array
    physicalType: ARRAY<VARCHAR(50)>
    description: VEP Consequence terms (Sequence Ontology, e.g. missense_variant) of the picked transcript only,
      split on '&'. Other transcripts' consequences are in snv__consequence.
    customProperties:
    - property: descriptionSource
      value: etl:tasks/vcf/snv/consequence.py; etl:tasks/vcf/snv/variant.py; etl:data_qa/macros/dictionaries.sql
        dict_consequences
  - name: vep_impact
    logicalType: string
    physicalType: VARCHAR(20)
    description: 'VEP IMPACT of the picked consequence: HIGH, MODERATE, LOW or MODIFIER.'
    customProperties:
    - property: descriptionSource
      value: etl:tasks/vcf/snv/consequence.py; etl:tasks/vcf/snv/variant.py; etl:data_qa/macros/dictionaries.sql
        dict_vep_impact
    enum:
    - value: HIGH
    - value: MODERATE
    - value: LOW
    - value: MODIFIER
  - name: is_mane_select
    logicalType: boolean
    physicalType: BOOLEAN
    description: True when the picked transcript is the MANE Select transcript (VEP MANE = MANE_Select).
    customProperties:
    - property: descriptionSource
      value: etl:tasks/vcf/snv/consequence.py; etl:tasks/vcf/snv/variant.py
  - name: is_mane_plus
    logicalType: boolean
    physicalType: BOOLEAN
    description: True when the picked transcript is a MANE Plus Clinical transcript (VEP MANE = MANE_Plus_Clinical);
      mutually exclusive with is_mane_select.
    customProperties:
    - property: descriptionSource
      value: etl:tasks/vcf/snv/consequence.py; etl:tasks/vcf/snv/variant.py
  - name: is_canonical
    logicalType: boolean
    physicalType: BOOLEAN
    description: True when the picked transcript is VEP's canonical transcript for the gene (CANONICAL = YES).
    customProperties:
    - property: descriptionSource
      value: etl:tasks/vcf/snv/consequence.py; etl:tasks/vcf/snv/variant.py
  - name: rsnumber
    logicalType: string
    physicalType: VARCHAR(20)
    description: dbSNP rs identifier of the allele (radiant.dbsnp, joined on locus_id), not the VCF ID column. NULL
      when the allele is not in dbSNP.
    customProperties:
    - property: descriptionSource
      value: etl:dags/sql/radiant/snv_staging_variant_insert.sql; etl:dags/sql/open_data/dbsnp_insert.sql
  - name: reference
    logicalType: string
    physicalType: VARCHAR(2000)
    description: Reference allele as in the VCF REF (VCF-style, anchored base included for indels).
    customProperties:
    - property: descriptionSource
      value: etl:tasks/vcf/snv/common.py
  - name: alternate
    logicalType: string
    physicalType: VARCHAR(2000)
    description: Alternate allele (the single ALT of the split record). Spanning-deletion '*' alleles are never
      loaded.
    customProperties:
    - property: descriptionSource
      value: etl:tasks/vcf/snv/common.py; etl:dags/sql/radiant/snv_tmp_variant_insert.sql
  - name: mane_select
    logicalType: string
    physicalType: varchar(200)
    description: 'Raw VEP MANE_SELECT value of the picked consequence: the versioned MANE Select accession paired
      with the picked transcript in the other catalogue (e.g. an NM_ accession for an Ensembl pick). Empty or NULL
      when the pick is not a MANE Select transcript.'
    customProperties:
    - property: descriptionSource
      value: etl:tasks/vcf/snv/consequence.py; etl:tasks/vcf/snv/variant.py
  - name: hgvsg
    logicalType: string
    physicalType: VARCHAR(2000)
    description: Genomic HGVS notation of the variant (VEP HGVSg of the picked consequence).
    customProperties:
    - property: descriptionSource
      value: etl:tasks/vcf/snv/consequence.py; etl:tasks/vcf/snv/variant.py
  - name: hgvsc
    logicalType: string
    physicalType: varchar(2000)
    description: Transcript HGVS notation of the picked transcript (VEP HGVSc, 'transcript:c.change'); NULL when
      the pick is not on a transcript.
    customProperties:
    - property: descriptionSource
      value: etl:tasks/vcf/snv/consequence.py; etl:tasks/vcf/snv/variant.py
  - name: hgvsp
    logicalType: string
    physicalType: varchar(2000)
    description: Protein HGVS notation of the picked transcript (VEP HGVSp, 'protein:p.change'); NULL when the change
      is not coding.
    customProperties:
    - property: descriptionSource
      value: etl:tasks/vcf/snv/consequence.py; etl:tasks/vcf/snv/variant.py
  - name: locus
    logicalType: string
    physicalType: VARCHAR(2000)
    description: Pipeline-wide variant key 'chromosome-start-reference-alternate' (no 'chr' prefix, 1-based VCF
      POS). Unique per locus; its SHA-256 is the locus_hash join key of the ETL.
    customProperties:
    - property: descriptionSource
      value: etl:tasks/vcf/snv/common.py locus_and_hash; etl:data_qa/sources/snv_variant.yml
  - name: dna_change
    logicalType: string
    physicalType: VARCHAR(2000)
    description: The c. part of hgvsc (text after the last ':'), e.g. c.123A>G; NULL when hgvsc is NULL.
    customProperties:
    - property: descriptionSource
      value: etl:tasks/vcf/snv/consequence.py
  - name: aa_change
    logicalType: string
    physicalType: VARCHAR(2000)
    description: The p. part of hgvsp (text after the last ':'); NULL when hgvsp is NULL.
    customProperties:
    - property: descriptionSource
      value: etl:tasks/vcf/snv/consequence.py
  - name: transcript_id
    logicalType: string
    physicalType: varchar(100)
    description: Picked transcript accession without its version (ENST... for Ensembl, NM_/NR_/XM_... for RefSeq);
      the version is stripped so it matches dbNSFP, gnomAD constraint and COSMIC transcript keys.
    customProperties:
    - property: descriptionSource
      value: etl:tasks/vcf/snv/consequence.py strip_transcript_version
  - name: pick_source
    logicalType: string
    physicalType: varchar(20)
    description: 'Transcript catalogue of the picked consequence: ''Ensembl'' or ''RefSeq'' (VEP SOURCE, else inferred
      from the transcript or gene id). NULL for intergenic picks and for rows loaded before the column existed (Ensembl-only
      loads).'
    customProperties:
    - property: descriptionSource
      value: etl:tasks/vcf/snv/consequence.py resolve_source; etl:dags/sql/radiant/migrations/SJRA-1833_snv_variant_add_pick_source.sql;
        etl:data_qa/sources/snv_variant.yml
  - name: omim_inheritance_code
    logicalType: array
    physicalType: array<varchar(5)>
    description: Distinct OMIM inheritance codes over all OMIM phenotypes of the picked gene symbol (radiant.omim_gene_panel,
      joined on symbol), e.g. AD, AR, XLR; a '?' prefix marks a provisional mode. NULL when the gene has no OMIM
      phenotype.
    customProperties:
    - property: descriptionSource
      value: etl:dags/sql/radiant/snv_staging_variant_insert.sql; etl:data_qa/macros/dictionaries.sql dict_omim_inheritance;
        frontend:translations/common/en.json
  - name: cmc_mutation_url
    logicalType: string
    physicalType: VARCHAR(255)
    description: URL of the mutation page in COSMIC. Taken from the COSMIC Mutation Census row of the locus (the
      transcript with the most mutated samples), else from the HGVS row matching the picked transcript_id and dna_change;
      NULL when in neither.
    customProperties:
    - property: descriptionSource
      value: etl:dags/sql/radiant/snv_staging_variant_insert.sql; etl:dags/sql/open_data/cosmic_mutation_set_insert.sql;
        hub:docs/features/RAD-15-cosmic-cmc-snv.md
  - name: cmc_sample_mutated
    logicalType: integer
    physicalType: INT
    description: Number of COSMIC samples carrying this mutation (COSMIC CMC). Taken from the COSMIC Mutation Census
      row of the locus (the transcript with the most mutated samples), else from the HGVS row matching the picked
      transcript_id and dna_change; NULL when in neither.
    customProperties:
    - property: descriptionSource
      value: etl:dags/sql/radiant/snv_staging_variant_insert.sql; etl:dags/sql/open_data/cosmic_mutation_set_insert.sql;
        hub:docs/features/RAD-15-cosmic-cmc-snv.md; frontend:translations/common/en.json
  - name: cmc_sample_ratio
    logicalType: number
    physicalType: DOUBLE
    description: 'COSMIC CMC sample_mutated / sample_tested: fraction of tested COSMIC samples carrying this mutation.
      Taken from the COSMIC Mutation Census row of the locus (the transcript with the most mutated samples), else
      from the HGVS row matching the picked transcript_id and dna_change; NULL when in neither.'
    customProperties:
    - property: unit
      value: ratio 0-1
    - property: descriptionSource
      value: etl:dags/sql/radiant/snv_staging_variant_insert.sql; etl:dags/sql/open_data/cosmic_mutation_set_insert.sql;
        hub:docs/features/RAD-15-cosmic-cmc-snv.md
  - name: cmc_tier
    logicalType: string
    physicalType: VARCHAR(8)
    description: 'COSMIC CMC mutation significance tier, as published: ''1'' high, ''2'' medium, ''3'' low, ''Other''
      no predicted significance. Taken from the COSMIC Mutation Census row of the locus (the transcript with the
      most mutated samples), else from the HGVS row matching the picked transcript_id and dna_change; NULL when
      in neither.'
    customProperties:
    - property: descriptionSource
      value: etl:dags/sql/radiant/snv_staging_variant_insert.sql; etl:dags/sql/open_data/cosmic_mutation_set_insert.sql;
