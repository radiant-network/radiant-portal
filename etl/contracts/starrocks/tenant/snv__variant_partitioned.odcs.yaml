# Owned by the ETL: the source of truth for this table. Change it in the same PR as the DDL (moon run etl:contracts-check).
apiVersion: v3.2.0
kind: DataContract
id: radiant.starrocks.tenant.snv__variant_partitioned
name: snv__variant_partitioned
version: 0.1.0
status: draft
domain: genomics
dataProduct: radiant-starrocks
description:
  purpose: 'Same columns and values as snv__variant plus part (variant_part = occurrence part DIV 10): one row per
    (variant_part, locus) for every variant_part in which the tenant has a germline or somatic SNV occurrence of
    the locus, colocated with the occurrence tables so case queries prune by partition. Each import rewrites its
    variant_part from snv__variant (dynamic INSERT OVERWRITE in import_part); reannotate_open_data rewrites all
    of them. Read by the MCP (always with part = <variant_part>); the portal reads snv__variant.'
  usage: 'Every query on a table partitioned by `part` carries `<alias>.part = <part>` as an equality, next to seq_id
    / task_id. Take `part` and `variant_part` from get_case_context''s occurrence_keys, from the key of the right
    data type; never compute them. Without it StarRocks scans every partition of the tenant and the query can time
    out. Join the catalog with `v.locus_id = o.locus_id AND v.part = <variant_part>`. Always filter on part: with
    a case key, v.part = <variant_part>; joined to an occurrence, v.locus_id = o.locus_id AND v.part = o.part DIV
    10. Joining on locus_id alone multiplies the rows (one copy per variant_part). For counts across sequencings,
    read snv__variant. The annotation is that of one picked consequence per variant: the VEP PICK=1 transcript,
    else the first canonical one. Other transcripts and the in-silico scores (dbNSFP, SpliceAI, gnomAD constraint)
    are not here but in snv__consequence / snv__consequence_filter_partitioned. Open-data columns are joined on
    locus_id (exact allele) from the shared radiant database when radiant.snv__staging_variant is built, and refreshed
    by reannotate_open_data. '
  limitations: 'Frequency columns (pc, pn, pf, hom, af) are COALESCEd to 0, never NULL; open-data columns are NULL
    when the allele is absent from the source. gnomad_v3_af is misnamed: it holds gnomAD 4.1 joint AF with the contract
    open-data tables. clinvar_name holds the ClinVar Variation ID, not a name. germline_af_* / somatic_af_* are
    diploid approximations. rsnumber keeps a single rs id when dbSNP lists several for the locus (snv__staging_variant
    is keyed on locus_id). An import rewrites only its own variant_part, so the tenant-wide frequency columns of
    other variant_parts can lag snv__variant until they are rewritten (next import into that variant_part, or reannotate_open_data).'
team:
- username: radiant-etl
  role: producer
- username: radiant-mcp
  role: consumer
servers:
- server: starrocks
  type: mysql
  host: starrocks
  port: 9030
  database: '{tenant}_tenant'
schema:
- name: snv__variant_partitioned
  physicalName: snv__variant_partitioned
  physicalType: table
  tags:
  - per-tenant
  properties:
  - name: part
    logicalType: integer
    physicalType: INT
    description: Variant partition (variant_part) = occurrence part DIV 10, i.e. covers occurrence parts [10*part,
      10*part + 9]. A locus has one copy in every variant_part where the tenant has a germline or somatic SNV occurrence
      of it; always filter on it (part = <variant_part>, or v.part = o.part DIV 10).
    customProperties:
    - property: descriptionSource
      value: etl:dags/import_part.py compute_part; etl:dags/sql/radiant/snv_variant_part_insert_part.sql; mcp:radiant_mcp/domain/keys.py;
        mcp:radiant_mcp/schema_catalog.py
    required: true
    partitioned: true
  - name: locus_id
    logicalType: integer
    physicalType: BIGINT
    description: 'Variant identifier: the GET_VARIANT_ID UDF encoding of (chromosome, start, reference, alternate),
      or, for alleles the UDF cannot encode, the id held for the locus_hash in radiant.variant_lookup. Same key
      as the occurrence, consequence and open-data tables; unique in snv__variant.'
    customProperties:
    - property: descriptionSource
      value: etl:dags/sql/radiant/snv_tmp_variant_insert.sql; etl:dags/sql/radiant/init/variant_id_udf.sql; etl:data_qa/sources/snv_variant.yml
    required: true
  - name: germline_pf_wgs
    logicalType: number
    physicalType: DOUBLE
    description: 'Patient (carrier) frequency in the tenant: germline_pc_wgs / germline_pn_wgs; 0 when the denominator
      is 0. Labelled in the portal as the patient frequency across the network (WGS).'
    customProperties:
    - property: unit
      value: ratio 0-1
    - property: descriptionSource
      value: etl:dags/sql/radiant/germline_snv_staging_variant_freq_insert.sql; etl:dags/sql/radiant/germline_snv_variant_frequency_insert.sql;
        etl:dags/sql/radiant/snv_variant_insert.sql; frontend:translations/common/en.json
