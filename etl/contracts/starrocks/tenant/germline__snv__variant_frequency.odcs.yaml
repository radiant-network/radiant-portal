    customProperties:
    - property: unit
      value: ratio 0-1
    - property: descriptionSource
      value: etl:dags/sql/radiant/germline_snv_staging_variant_freq_insert.sql; etl:dags/sql/radiant/germline_snv_variant_frequency_insert.sql;
        etl:dags/sql/radiant/snv_variant_insert.sql
  - name: pc_wxs
    logicalType: integer
    physicalType: BIGINT
    description: Number of distinct all patients with a WXS (exome) germline sequencing carrying the variant with
      a qualifying call (filter = PASS, GQ >= 20, ad_alt >= 3). 0 when the locus has only non-qualifying calls.
    customProperties:
    - property: descriptionSource
      value: etl:dags/sql/radiant/germline_snv_staging_variant_freq_insert.sql; etl:dags/sql/radiant/germline_snv_variant_frequency_insert.sql;
        frontend:translations/common/en.json freq_g_tooltip
  - name: pn_wxs
    logicalType: integer
    physicalType: BIGINT
    description: Number of distinct all patients with a WXS (exome) germline sequencing in the tenant (counted per
