  - property: mcpKeys
    value: locus_id, symbol, transcript_id
  - property: consumers
    value:
    - mcp/radiant_mcp/schema_catalog.py
    - portal/backend/internal/service/ranger_masking.go
    - portal/backend/internal/types/consequence.go
