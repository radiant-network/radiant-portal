# Owned by the ETL: the source of truth for this table. Change it in the same PR as the DDL (moon run etl:contracts-check).
apiVersion: v3.2.0
kind: DataContract
id: radiant.starrocks.shared.hpo_term
name: hpo_term
version: 0.1.0
status: draft
domain: genomics
dataProduct: radiant-starrocks
description:
  purpose: 'One row per Human Phenotype Ontology term (id and label), parsed from the hp.obo release. Fully overwritten
    by the ETL open-data import (group hpo_term) from the OpenDataLake table hpo_terms_v1 or the legacy Radiant
    Iceberg table hpo_term. Shared dictionary.

    '
  usage: 'Filter occurrences on predictors with `LEFT SEMI JOIN radiant.snv__consequence_filter_partitioned cf ON
    cf.locus_id = o.locus_id AND cf.part = o.part AND (<condition>)`. Look up by id (HP:nnnnnnn). The portal uses
    it for phenotype autocomplete and to label case phenotypes (phenotype_id / phenotype_name / phenotype_term);
    the ETL and MCP join it on id = observation code_value.

    '
  limitations: 'Obsolete terms are imported and not flagged (obo-parser 1.3.1 has no is_obsolete handling). Parents,
    alt_ids, synonyms and definitions are not imported.

    '
team:
- username: radiant-etl
  role: producer
- username: radiant-portal
  role: consumer
- username: radiant-mcp
  role: consumer
servers:
- server: starrocks
  type: mysql
  host: starrocks
  port: 9030
  database: radiant
schema:
- name: hpo_term
  physicalName: hpo_term
  physicalType: table
  tags:
  - shared
  properties:
  - name: id
    logicalType: string
    physicalType: varchar(65533)
    description: HPO term id, HP:nnnnnnn (e.g. HP:0000118).
    customProperties:
    - property: descriptionSource
      value: etl:dags/sql/open_data/hpo_term_insert.sql; upstream:hpo (radiant-open-datalake release-notes hpo_terms/v1.md);
        mcp:schema_catalog.py
    required: true
    unique: true
  - name: name
    logicalType: string
    physicalType: varchar(65533)
    description: HPO term label (obo name).
    customProperties:
    - property: descriptionSource
      value: etl:dags/sql/open_data/hpo_term_insert.sql; upstream:hpo (radiant-open-datalake release-notes hpo_terms/v1.md)
    required: true
  - name: term
    logicalType: string
    physicalType: varchar(65533)
    description: Generated column, concat(id, ' ', name), e.g. "HP:0001250 Seizure"; used for text search/autocomplete.
    customProperties:
    - property: descriptionSource
      value: etl:dags/sql/open_data/init/hpo_term_create_table.sql; portal:internal/types/term.go
  quality:
  - name: hpo_term__should_not_be_empty
    metric: rowCount
    mustBeGreaterThan: 0
    dimension: completeness
  - name: hpo_term__should_not_contain_only_null
    type: sql
    dimension: completeness
    description: No column is entirely NULL (except id, name).
    query: SELECT (CASE WHEN COUNT(term) = 0 THEN 1 ELSE 0 END) FROM hpo_term
    mustBe: 0
  - name: hpo_term__should_not_contain_same_value
    type: sql
    dimension: accuracy
    description: No scalar column holds a single constant value (except id).
    query: SELECT (CASE WHEN COUNT(DISTINCT name) <= 1 THEN 1 ELSE 0 END) + (CASE WHEN COUNT(DISTINCT term) <= 1
      THEN 1 ELSE 0 END) FROM hpo_term
    mustBe: 0
  customProperties:
  - property: dataModel
    value: DUPLICATE KEY(`id`)
  - property: distributedBy
    value: DISTRIBUTED BY RANDOM
  - property: mcpKeys
    value: id
  - property: consumers
    value:
    - mcp/radiant_mcp/queries/carriers.py
    - mcp/radiant_mcp/schema_catalog.py
    - mcp/radiant_mcp/tools/cohort.py
    - portal/backend/internal/types/term.go
authoritativeDefinitions:
- type: ddl
  url: radiant-portal-pipeline:radiant/dags/sql/open_data/init/hpo_term_create_table.sql
- type: dataQuality
  url: radiant-portal-pipeline:radiant/data_qa/sources/hpo_term.yml
- type: mcpCatalog
  url: radiant-mcp:radiant_mcp/schema_catalog.py
