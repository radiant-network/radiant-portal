language: 'python'
layer: 'application'
stack: 'data'

fileGroups:
  sources: ['radiant/**/*', 'tests/**/*', 'pyproject.toml', 'pytest.ini', '.ruff.toml', 'requirements*.txt']
  # What the ETL publishes to the backend and the MCP: one contract per StarRocks table they read.
  contracts: ['contracts/starrocks/**/*']
  # What the contracts are checked against.
  schema:
    - 'radiant/dags/sql/*/init/*'
    - 'radiant/data_qa/sources/*'
    - 'radiant/data_qa/macros/dictionaries.sql'
    - 'radiant/tasks/data/radiant_tables.py'

tasks:
  venv:
    script: 'uv venv -q --allow-existing -p 3.12 .venv && uv pip install -q -p .venv -r requirements.txt -r requirements-dev.txt'
    inputs: ['requirements*.txt']
    outputs: ['.venv']
    options:
      cache: false
  lint:
    command: '.venv/bin/ruff check radiant/'
    inputs: ['radiant/**/*.py', '.ruff.toml', 'pyproject.toml']
    deps: ['venv']
  test-unit:
    command: '.venv/bin/pytest -q tests/unit'
    inputs: ['@group(sources)']
    deps: ['venv']

  # ---- Data contracts (contracts/): the DDL and the data QA must match them, and a change must not break readers.
  contracts-check:
    command: 'uv run -q --no-project --with pyyaml==6.0.2 python contracts/check.py'
    inputs: ['@group(contracts)', '@group(schema)', 'contracts/check.py']
  contracts-breaking:
    command: 'uv run -q --no-project --with pyyaml==6.0.2 python $workspaceRoot/scripts/contracts-breaking.py contracts'
    inputs: ['@group(contracts)', '/scripts/contracts-breaking.py']
    options:
      cache: false  # compares with $CONTRACTS_BASE (default main), not an input

  # ---- Docker images: each one only copies part of the ETL.
  docker-dbt:
    tags: ['docker']
    env:
      TRIVY_IGNOREFILE: 'etl/.trivyignore.yaml'
    command: '$workspaceRoot/scripts/docker.sh radiant-dbt Dockerfile.radiant.dbt .'
    inputs:
      - 'Dockerfile.radiant.dbt'
      - 'radiant/data_qa/**/*'
      - 'scripts/dbt/**/*'
    deps: []
    options:
      runInCI: 'affected'
      cache: false  # side effect (push): never replay from moon's cache
  docker-operator:
    tags: ['docker']
    env:
      TRIVY_IGNOREFILE: 'etl/.trivyignore.yaml'
    command: '$workspaceRoot/scripts/docker.sh radiant-task-operator Dockerfile.radiant.operator .'
    inputs:
      - 'Dockerfile.radiant.operator'
      - 'requirements.txt'
      - 'radiant/**/*'
      - 'scripts/ecs/**/*'
    deps: ['test-unit']
    options:
      runInCI: 'affected'
      cache: false  # side effect (push): never replay from moon's cache
  docker-nextflow-launcher:
    tags: ['docker']
    env:
      TRIVY_IGNOREFILE: 'etl/.trivyignore.yaml'
    command: '$workspaceRoot/scripts/docker.sh nextflow-launcher Dockerfile.nextflow.launcher .'
    inputs:
      - 'Dockerfile.nextflow.launcher'
    deps: []
    options:
      runInCI: 'affected'
      cache: false  # side effect (push): never replay from moon's cache
  # Local dev image (`make` in the ETL), never published nor deployed: no `docker` tag.
  docker-airflow:
    command: '$workspaceRoot/scripts/docker.sh radiant-airflow Dockerfile .'
    inputs:
      - 'Dockerfile'
      - 'requirements-airflow.txt'
    deps: []
    options:
      runInCI: 'affected'
      cache: false  # side effect (push): never replay from moon's cache
