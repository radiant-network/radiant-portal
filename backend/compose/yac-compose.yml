# YAC agent (HIDIVE udi-yac, https://github.com/hms-dbmi/udi-yac) for the local-dev stack. POC.
# Gated by the `yac` profile: a plain `docker compose up` never starts it. Use
# `YAC_ENABLED=true make docker-run` (or `COMPOSE_PROFILES=yac docker compose up`).
#
# The LLM is a local Ollama on the host (Docker on macOS has no GPU access, so a containerised
# Ollama is CPU-only and too slow). Before starting: `ollama serve` and `ollama pull qwen3:14b`.
#
# The image is built straight from the public git repo. To iterate on agent code, point
# YAC_BUILD_CONTEXT at a local clone (path relative to this file), e.g. ../../../udi-yac.
# Auth: Keycloak JWTs (radiant realm), passed through to StarRocks. See YAC.md for the env
# overrides and a smoke test.
services:
  yac-agent:
    profiles: [yac]
    build:
      context: ${YAC_BUILD_CONTEXT:-https://github.com/hms-dbmi/udi-yac.git#main}
      dockerfile: packages/agent/Dockerfile
    image: radiant/yac-agent:local
    ports:
      - "${YAC_PORT:-8007}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OPENAI_BASE_URL: ${YAC_LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      GPT_MODEL_NAME: ${YAC_MODEL:-qwen3:14b}
      UDI_CORS_ORIGINS: ${YAC_CORS_ORIGINS:-http://localhost:3000}
      # Keycloak auth, same realm/audience as the API and the StarRocks JWT users. Keys are
      # fetched in-network; the issuer is the host-facing URL tokens are minted through.
      JWT_JWKS_URL: "${YAC_KEYCLOAK:-http://keycloak:8080/realms/radiant}/protocol/openid-connect/certs"
      JWT_ALGORITHM: RS256
      JWT_ISSUER: ${YAC_KEYCLOAK:-http://keycloak:8080/realms/radiant}
      JWT_AUDIENCE: radiant
      # StarRocks packages with JWT passthrough: queries run as the caller (StarRocks user =
      # Keycloak sub), so Ranger masks/filters apply per user. See yac/backends.json.
      UDI_QUERY_BACKENDS: /config/backends.json
    volumes:
      - ./yac/backends.json:/config/backends.json:ro
      - starrocks-certs:/certs:ro
    depends_on:
      keycloak:
        condition: service_started
      starrocks:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost/')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
