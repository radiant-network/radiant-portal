# Owned by the backend: the source of truth for this view, hand-edited (moon run backend:contracts-check).
# Scaffolded by `go run ./cmd/contracts`: add the descriptions, remove the columns no reader should use.
apiVersion: v3.2.0
kind: DataContract
id: radiant.starrocks.tenant.histology_type
name: histology_type
version: 0.1.0
status: draft
domain: clinical
dataProduct: radiant-portal-tenant
description:
  purpose: 'Histology of a sample: tumoral or normal. Referenced by sample.histology_code. Shared by every tenant (the PostgreSQL
    table has no tenant_code), exposed in each {tenant}_tenant database through radiant_jdbc; the portal also serves it as
    GET /value_sets/{type}.'
  usage: Join sample.histology_code = histology_type.code for the label. The ETL selects the tumoral sequencing of a somatic
    case for QC. The sample batch only accepts tumoral and normal.
  limitations: 'The values are data seeded by the backend migrations (backend/scripts/init-sql/migrations), not a fixed enum:
    later migrations or a deployment can add codes, so query the view for the current list. Codes are unique case-insensitively
    (migration 000034) and stored in the case they were entered in.'
team:
- username: radiant-portal
  role: producer
- username: radiant-mcp
  role: consumer
servers:
- server: starrocks
  type: mysql
  host: starrocks
  port: 9030
  database: '{tenant}_tenant'
schema:
- name: histology_type
  physicalName: histology_type
  physicalType: view
  tags:
  - per-tenant
  properties:
  - name: code
    logicalType: string
    description: Code of the histology type, primary key; the value stored in the referencing columns.
    customProperties:
    - property: postgresType
      value: text
    - property: descriptionSource
      value: backend:scripts/init-sql/migrations/000001_init.up.sql; backend:internal/types/sample_batch.go; etl:dags/sql/clinical/pending_quality_control_somatic_select.sql
    examples:
    - tumoral
    - normal
  - name: name_en
    logicalType: string
    description: English label of the code (Tumoral, Normal).
    customProperties:
    - property: postgresType
      value: text
    - property: descriptionSource
      value: backend:scripts/init-sql/migrations/000001_init.up.sql
authoritativeDefinitions:
- type: implementation
  url: backend:internal/repository/starrocks/starrocks_tenant.go
