# Owned by the backend: the source of truth for this view, hand-edited (moon run backend:contracts-check).
# Scaffolded by `go run ./cmd/contracts`: add the descriptions, remove the columns no reader should use.
apiVersion: v3.2.0
kind: DataContract
id: radiant.starrocks.tenant.v_pcx_30_radiation_level_combined
name: v_pcx_30_radiation_level_combined
version: 0.1.0
status: draft
domain: clinical
dataProduct: radiant-portal-tenant
description:
  purpose: >-
    PCX 3.0 radiation therapy, several rows per patient: one per distinct radiation course of the CBTN treatment
    table (radiation = 'Yes'), with start and stop ages, site, type, craniospinal and focal doses, and whether it
    was part of the initial treatment. Grant-guarded read surface over
    radiant_data_dev.v_pcx_30_radiation_level_combined.
  usage: >-
    Read it as the end user (the portal API and the MCP query StarRocks with the caller's JWT). Join on
    (organization_code, patient_id_type, patient_id); v_pcx_30_patient_key maps that key to patient_key.
    v_pcx_30_patient_list.got_radiation_ever already says whether a patient has any row here. Read each dose with
    its unit column. To count non-frontline courses, exclude CAST(age_at_radiation_start_days AS INT) IS NULL first.
  limitations: >-
    is_initial_treatment = 'no' means "not known to be initial treatment": 37% of 'no' rows on the 2026-10-01 build
    are indeterminate (start age 'Not Available' / 'Not Reported', or no initial-diagnosis anchor). The ages are
    text that can hold those sentinels. Column masking only, no row filtering; a NULL organization_code fails
    closed; the lab grant is not bounded by organization_code; radiant_patient_id is projected unmasked.
team:
  - username: radiant-portal
    role: producer
  - username: radiant-mcp
    role: consumer
servers:
  - server: starrocks
    type: mysql
    host: starrocks
    port: 9030
    database: '{tenant}_tenant'
schema:
  - name: v_pcx_30_radiation_level_combined
    physicalName: v_pcx_30_radiation_level_combined
    physicalType: view
    tags:
      - per-tenant
    properties:
      - name: organization_name
        description: Name of the institution that contributed the patient's data (the pcx_30_organization_override
          seed wins where it carries the patient). Shown to every caller.
        customProperties:
          - property: descriptionSource
            value: backend:scripts/pcx_tables/view_data_dictionary_access_policy.csv
      - name: organization_code
        description: Code of the contributing institution, pcx_30_organization_ref.code joined on the organization
          name (the override seed wins). The vocabulary auth.pii_grant keys on; NULL fails closed to de-identified.
        examples:
          - CHOP
          - SCH
          - UCSF-BCH
        customProperties:
          - property: descriptionSource
            value: backend:scripts/pcx_tables/access_controlled_views/radiation_level_access_controlled.sql.tmpl
      - name: patient_id
        description: "The patient's identifier as this caller may see it: CASE WHEN can_read_phi THEN mrn ELSE
          research_id END. Join key only: never select or show it."
        customProperties:
          - property: descriptionSource
            value: backend:scripts/pcx_tables/access_controlled_views/radiation_level_access_controlled.sql.tmpl
      - name: patient_id_type
        description: "'mrn' when can_read_phi, else 'research_id': the namespace of patient_id on this row."
        examples:
          - mrn
          - research_id
        customProperties:
          - property: descriptionSource
            value: backend:scripts/pcx_tables/access_controlled_views/radiation_level_access_controlled.sql.tmpl
      - name: radiant_patient_id
        description: Portal patient id (radiant_jdbc.public.patient.id), matched on organization_code and the MRN
          with leading zeros stripped on both sides; NULL when the patient has no portal record. Not masked.
        customProperties:
          - property: descriptionSource
            value: backend:scripts/pcx_tables/access_controlled_views/radiation_level_access_controlled.sql.tmpl
      - name: radiation_start_date
        description: Start date of the course, date_add(dob, age_at_radiation_start_days). NULL without PHI access
          or when the age is a sentinel.
        customProperties:
          - property: descriptionSource
            value: backend:scripts/pcx_tables/access_controlled_views/radiation_level_access_controlled.sql.tmpl; backend:scripts/pcx_tables/starrocks-dbt/starrocks_radiant/models/pcx_30/combined/v_pcx_30_radiation_level_combined.sql
      - name: age_at_radiation_start_days
        description: Age in days at the start of the course (treatment.age_at_radiation_start; a reviewer-accepted
          override wins). Can be 'Not Available' or 'Not Reported'.
        customProperties:
          - property: descriptionSource
            value: backend:scripts/pcx_tables/starrocks-dbt/starrocks_radiant/models/pcx_30/combined/v_pcx_30_radiation_level_combined.sql
      - name: radiation_stop_date
        description: Stop date of the course, date_add(dob, age_at_radiation_stop_days). NULL without PHI access or
          when the age is a sentinel.
        customProperties:
          - property: descriptionSource
            value: backend:scripts/pcx_tables/access_controlled_views/radiation_level_access_controlled.sql.tmpl; backend:scripts/pcx_tables/starrocks-dbt/starrocks_radiant/models/pcx_30/combined/v_pcx_30_radiation_level_combined.sql
      - name: age_at_radiation_stop_days
        description: Age in days at the end of the course (treatment.age_at_radiation_stop). Carries the same
          sentinels as the start age.
        customProperties:
          - property: descriptionSource
            value: backend:scripts/pcx_tables/starrocks-dbt/starrocks_radiant/models/pcx_30/combined/v_pcx_30_radiation_level_combined.sql
      - name: radiation_site
        description: Field or site of radiation.
        customProperties:
          - property: descriptionSource
            value: backend:scripts/pcx_tables/view_data_dictionary_access_policy.csv
      - name: radiation_site_other
        description: Free-text site given when the coded radiation_site does not cover it.
        customProperties:
          - property: descriptionSource
            value: backend:scripts/pcx_tables/view_data_dictionary_access_policy.csv
      - name: radiation_type
        description: Method or type of radiation delivered.
        customProperties:
          - property: descriptionSource
            value: backend:scripts/pcx_tables/view_data_dictionary_access_policy.csv
      - name: radiation_type_other
        description: Free-text type given when the coded radiation_type does not cover it.
        customProperties:
          - property: descriptionSource
            value: backend:scripts/pcx_tables/view_data_dictionary_access_policy.csv
      - name: total_radiation_dose
        description: Dose of craniospinal radiation given, in total_radiation_dose_unit.
        customProperties:
          - property: descriptionSource
            value: backend:scripts/pcx_tables/view_data_dictionary_access_policy.csv
      - name: total_radiation_dose_unit
        description: Unit of total_radiation_dose.
        customProperties:
          - property: descriptionSource
            value: backend:scripts/pcx_tables/view_data_dictionary_access_policy.csv
      - name: total_radiation_dose_focal
        description: Total radiation given to the primary site, in total_radiation_dose_focal_unit.
        customProperties:
          - property: descriptionSource
            value: backend:scripts/pcx_tables/view_data_dictionary_access_policy.csv
      - name: total_radiation_dose_focal_unit
        description: Unit of total_radiation_dose_focal.
        customProperties:
          - property: descriptionSource
            value: backend:scripts/pcx_tables/view_data_dictionary_access_policy.csv
      - name: is_initial_treatment
        description: "'yes' when the course started between the initial-diagnosis age and the first subsequent
          disease event age (int_pcx_30_initial_events); 'no' otherwise, including when it cannot be determined.
          Computed from ages only; not recomputed when a reviewer overrides the start age."
        examples:
          - 'yes'
          - 'no'
        customProperties:
          - property: descriptionSource
            value: backend:scripts/pcx_tables/starrocks-dbt/starrocks_radiant/models/pcx_30/combined/v_pcx_30_radiation_level_combined.sql; backend:scripts/pcx_tables/view_data_dictionary_access_policy.csv
      - name: can_read_phi
        description: "TRUE when the caller may read this row's PHI: an org grant (auth.pii_grant, a can_read_pii
          role at the row's organization_code) or a lab grant (auth.pii_lab_patient, a can_read_pii role at the
          diagnosis lab of a portal case of radiant_patient_id). The caller is current_user(), the JWT sub."
        customProperties:
          - property: descriptionSource
            value: backend:scripts/pcx_tables/access_controlled_views/radiation_level_access_controlled.sql.tmpl; backend:internal/repository/starrocks/views/auth_pii_lab_patient.sql
    customProperties:
      - property: consumers
        value:
          - backend/internal/repository/starrocks/pcx_patients.go
          - backend/internal/types/pcx_patient_query.go
          - backend/scripts/seed/views/v_pcx_30_patient_list.sql.tmpl
authoritativeDefinitions:
  - type: implementation
    url: backend:scripts/pcx_tables/access_controlled_views/radiation_level_access_controlled.sql.tmpl
