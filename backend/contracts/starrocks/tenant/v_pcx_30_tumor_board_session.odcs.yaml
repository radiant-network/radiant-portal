# Owned by the backend: the source of truth for this view, hand-edited (moon run backend:contracts-check).
# Scaffolded by `go run ./cmd/contracts`: add the descriptions, remove the columns no reader should use.
apiVersion: v3.2.0
kind: DataContract
id: radiant.starrocks.tenant.v_pcx_30_tumor_board_session
name: v_pcx_30_tumor_board_session
version: 0.1.0
status: draft
domain: clinical
dataProduct: radiant-portal-tenant
description:
  purpose: >-
    Tumor board sessions of each PCX patient, one row per session (radiant_data_dev.tumor_board_session, keyed on
    research_id): age at the session, reason, diagnosis, consensus, recommendations, status and, with PHI access,
    the session date and the S3 URL of its report. Radiant's own view, built like v_pcx_30_hin_exchange: under the
    identifier the caller sees through the secured v_pcx_30_demographics_combined, the source join only mapping it
    back to the research id.
  usage: >-
    Read it as the end user (StarRocks with the caller's JWT). Filter on (organization_code, patient_id_type,
    patient_id) from v_pcx_30_patient_key; (that key, session_id) identifies a session. The portal lists sessions
    by age_at_tumor_board_days descending and splits recommendations on ';'. Use age_at_tumor_board_days, never
    tumor_board_date.
  limitations: >-
    tumor_board_date and report_url are NULL without PHI access; reason, diagnosis, consensus and recommendations
    are free text shown to every caller. Loaded by hand in QA and PRD (one patient so far). patient_id is an MRN for
    a PHI caller: never select or show it.
team:
  - username: radiant-portal
    role: producer
  - username: radiant-mcp
    role: consumer
servers:
  - server: starrocks
    type: mysql
    host: starrocks
    port: 9030
    database: '{tenant}_tenant'
schema:
  - name: v_pcx_30_tumor_board_session
    physicalName: v_pcx_30_tumor_board_session
    physicalType: view
    tags:
      - per-tenant
    properties:
      - name: organization_code
        description: Code of the contributing institution (v_pcx_30_demographics_combined). Part of the join key.
        customProperties:
          - property: descriptionSource
            value: backend:scripts/seed/views/v_pcx_30_tumor_board_session.sql.tmpl
      - name: patient_id_type
        description: "'mrn' or 'research_id' (v_pcx_30_demographics_combined): the namespace of patient_id for this
          caller."
        examples:
          - mrn
          - research_id
        customProperties:
          - property: descriptionSource
            value: backend:scripts/seed/views/v_pcx_30_tumor_board_session.sql.tmpl
      - name: patient_id
        description: The patient's identifier as this caller may see it (MRN with PHI access, research id
          without). Join key only, never select or show it.
        customProperties:
          - property: descriptionSource
            value: backend:scripts/seed/views/v_pcx_30_tumor_board_session.sql.tmpl
      - name: session_id
        description: Number of the session among the patient's tumor board sessions (tumor_board_session.session_id,
          INT); the portal downloads a session's report by it.
        customProperties:
          - property: descriptionSource
            value: backend:scripts/seed/pcx.py; backend:internal/repository/starrocks/pcx_patients.go
      - name: tumor_board_date
        description: Date of the session (DATE). PHI, NULL without PHI access.
        customProperties:
          - property: descriptionSource
            value: backend:scripts/seed/views/v_pcx_30_tumor_board_session.sql.tmpl; backend:scripts/seed/pcx.py
      - name: age_at_tumor_board_days
        description: Age in days at the session (INT), shown to every caller.
        customProperties:
          - property: descriptionSource
            value: backend:scripts/seed/pcx.py; backend:scripts/seed/views/v_pcx_30_tumor_board_session.sql.tmpl
      - name: reason
        description: Reason the patient was presented at the tumor board (free text).
        customProperties:
          - property: descriptionSource
            value: backend:scripts/seed/views/v_pcx_30_tumor_board_session.sql.tmpl
      - name: diagnosis
        description: Diagnosis as presented at the session (free text).
        customProperties:
          - property: descriptionSource
            value: backend:scripts/seed/views/v_pcx_30_tumor_board_session.sql.tmpl
      - name: consensus
        description: Consensus of the tumor board (free text).
        customProperties:
          - property: descriptionSource
            value: backend:scripts/seed/views/v_pcx_30_tumor_board_session.sql.tmpl
      - name: recommendations
        description: Recommendations of the session, separated by semicolons.
        customProperties:
          - property: descriptionSource
            value: backend:scripts/seed/views/v_pcx_30_tumor_board_session.sql.tmpl; backend:internal/repository/starrocks/pcx_patients.go
      - name: status
        description: Status of the session record (tumor_board_session.status).
        customProperties:
          - property: descriptionSource
            value: backend:scripts/seed/views/v_pcx_30_tumor_board_session.sql.tmpl
      - name: report_url
        description: S3 URL of the session's report. PHI, NULL without PHI access.
        customProperties:
          - property: descriptionSource
            value: backend:scripts/seed/views/v_pcx_30_tumor_board_session.sql.tmpl
      - name: can_read_phi
        description: can_read_phi of the patient's v_pcx_30_demographics_combined row (org grant or lab grant of
          the caller); gates tumor_board_date and report_url.
        customProperties:
          - property: descriptionSource
            value: backend:scripts/seed/views/v_pcx_30_tumor_board_session.sql.tmpl
    customProperties:
      - property: consumers
        value:
          - backend/internal/repository/starrocks/pcx_patients.go
          - backend/internal/types/pcx_patient_query.go
authoritativeDefinitions:
  - type: implementation
    url: backend:scripts/seed/views/v_pcx_30_tumor_board_session.sql.tmpl
