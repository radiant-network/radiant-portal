# Owned by the backend: the source of truth for this view, hand-edited (moon run backend:contracts-check).
# Scaffolded by `go run ./cmd/contracts`: add the descriptions, remove the columns no reader should use.
apiVersion: v3.2.0
kind: DataContract
id: radiant.starrocks.tenant.sample_type
name: sample_type
version: 0.1.0
status: draft
domain: clinical
dataProduct: radiant-portal-tenant
description:
  purpose: Type of a biological sample (blood, solid tissue, DNA, saliva...). Referenced by sample.type_code. Shared by every
    tenant (the PostgreSQL table has no tenant_code), exposed in each {tenant}_tenant database through radiant_jdbc; the portal
    also serves it as GET /value_sets/{type}.
  usage: Join sample.type_code = sample_type.code for the label.
  limitations: 'The values are data seeded by the backend migrations (backend/scripts/init-sql/migrations), not a fixed enum:
    later migrations or a deployment can add codes, so query the view for the current list. Codes are unique case-insensitively
    (migration 000034) and stored in the case they were entered in.'
team:
- username: radiant-portal
  role: producer
- username: radiant-mcp
  role: consumer
servers:
- server: starrocks
  type: mysql
  host: starrocks
  port: 9030
  database: '{tenant}_tenant'
schema:
- name: sample_type
  physicalName: sample_type
  physicalType: view
  tags:
  - per-tenant
  properties:
  - name: code
    logicalType: string
    description: Code of the sample type, primary key; the value stored in the referencing columns.
    customProperties:
    - property: postgresType
      value: text
    - property: descriptionSource
      value: backend:scripts/init-sql/migrations/000001_init.up.sql; backend:scripts/init-sql/migrations/000002_saliva_not_reported_sample_type.up.sql;
        backend:scripts/init-sql/migrations/000005_add_buffy_coat_sample_type.up.sql; backend:scripts/init-sql/migrations/000007_add_buccal_swab_sample_type.up.sql;
        backend:scripts/init-sql/migrations/000046_add_brain_spinal_cord_sample_types.up.sql
    examples:
    - blood
    - solid_tissue
    - dna
    - rna
    - saliva
    - not_reported
    - buffy_coat
    - buccal_swab
    - brain
    - spinal_cord
  - name: name_en
    logicalType: string
    description: English label of the code (e.g. Solid Tissue, Buffy Coat, Not Reported).
    customProperties:
    - property: postgresType
      value: text
    - property: descriptionSource
      value: backend:scripts/init-sql/migrations/000001_init.up.sql
authoritativeDefinitions:
- type: implementation
  url: backend:internal/repository/starrocks/starrocks_tenant.go
