# Owned by the backend: the source of truth for this view, hand-edited (moon run backend:contracts-check).
# Scaffolded by `go run ./cmd/contracts`: add the descriptions, remove the columns no reader should use.
apiVersion: v3.2.0
kind: DataContract
id: radiant.starrocks.tenant.organization_category
name: organization_category
version: 0.1.0
status: draft
domain: clinical
dataProduct: radiant-portal-tenant
description:
  purpose: 'Category of an organization: diagnostic laboratory, healthcare provider, research institute or sequencing center.
    Referenced by organization.category_code. Shared by every tenant (the PostgreSQL table has no tenant_code), exposed in
    each {tenant}_tenant database through radiant_jdbc; the portal also serves it as GET /value_sets/{type}.'
  usage: Join organization.category_code = organization_category.code for the label. The portal takes the diagnosis labs of
    its filters from diagnostic_laboratory and the ordering organizations from healthcare_provider and research_institute.
  limitations: 'The values are data seeded by the backend migrations (backend/scripts/init-sql/migrations), not a fixed enum:
    later migrations or a deployment can add codes, so query the view for the current list. Codes are unique case-insensitively
    (migration 000034) and stored in the case they were entered in.'
team:
- username: radiant-portal
  role: producer
- username: radiant-mcp
  role: consumer
servers:
- server: starrocks
  type: mysql
  host: starrocks
  port: 9030
  database: '{tenant}_tenant'
schema:
- name: organization_category
  physicalName: organization_category
  physicalType: view
  tags:
  - per-tenant
  properties:
  - name: code
    logicalType: string
    description: Code of the organization category, primary key; the value stored in the referencing columns.
    customProperties:
    - property: postgresType
      value: text
    - property: descriptionSource
      value: backend:scripts/init-sql/migrations/000001_init.up.sql; backend:internal/repository/starrocks/cases.go
    examples:
    - diagnostic_laboratory
    - healthcare_provider
    - research_institute
    - sequencing_center
  - name: name_en
    logicalType: string
    description: English label of the code (Diagnostic Laboratory, Healthcare Provider, Research Institute, Sequencing Center).
    customProperties:
    - property: postgresType
      value: text
    - property: descriptionSource
      value: backend:scripts/init-sql/migrations/000001_init.up.sql
  customProperties:
  - property: consumers
    value:
    - backend/internal/utils/joins/joins.go
authoritativeDefinitions:
- type: implementation
  url: backend:internal/repository/starrocks/starrocks_tenant.go
