# Owned by the backend: the source of truth for this view, hand-edited (moon run backend:contracts-check).
# Scaffolded by `go run ./cmd/contracts`: add the descriptions, remove the columns no reader should use.
apiVersion: v3.2.0
kind: DataContract
id: radiant.starrocks.tenant.v_pcx_30_patient_list
name: v_pcx_30_patient_list
version: 0.1.0
status: draft
domain: clinical
dataProduct: radiant-portal-tenant
description:
  purpose: >-
    The portal PCX patient list, one row per patient of v_pcx_30_demographics_combined: patient_key, identity,
    cohorts, initial CNS diagnosis, vital status, age at initial diagnosis, survival, and flags for imaging,
    radiation, chemotherapy agents and Radiant cases. Radiant's own view, built only on the secured pcx_30 views of
    the same database (demographics, patient key, patient level, event level, treatment summary, MRI, radiation,
    medical therapy) plus the tenant's cases and family tables; it adds no PHI rule and reads nothing the caller
    cannot already read.
  usage: >-
    Read it as the end user (StarRocks with the caller's JWT). The portal's search_patients reads it through a
    subquery that adds patient_name (only where can_read_phi) and age_at_initial_dx_group, with filters as
    field IN (...) or arrays_overlap for chemotherapy_agents; the MCP survival_curve reads the same rows
    (patient_key, survival_days, vital_status, radiant_patient_id, case_count). Join other PCX views through
    v_pcx_30_patient_key on patient_key. Pass survival groups to survival_curve rather than computing survival in
    SQL. Each read re-runs the grant lookups of every secured view it joins: read it once.
  limitations: >-
    Expensive: one row costs every secured view it joins (the portal patient page does not read it). Not
    guaranteed unique per patient: v_pcx_30_demographics_combined has one row per cohort diagnosis. given_name,
    family_name and patient_id are PHI for a PHI caller; patient_name in the API is built only where can_read_phi.
    chemotherapy_agents splits the source text on commas without stripping quotes, and the source keeps literal
    double quotes.
team:
  - username: radiant-portal
    role: producer
  - username: radiant-mcp
    role: consumer
servers:
  - server: starrocks
    type: mysql
    host: starrocks
    port: 9030
    database: '{tenant}_tenant'
schema:
  - name: v_pcx_30_patient_list
    physicalName: v_pcx_30_patient_list
    physicalType: view
    tags:
      - per-tenant
    properties:
      - name: patient_key
        description: Key of the patient's portal page (UUID), from v_pcx_30_patient_key matched on the caller's
          identifier; the same for every caller. NULL when the patient has no key.
        relationships:
          - type: foreignKey
            to: v_pcx_30_patient_key.patient_key
        customProperties:
          - property: descriptionSource
            value: backend:scripts/seed/views/v_pcx_30_patient_list.sql.tmpl; mcp:radiant_mcp/schema_catalog.py
      - name: organization_code
        description: Code of the contributing institution (v_pcx_30_demographics_combined).
        examples:
          - CHOP
          - SCH
          - UCSF-BCH
        customProperties:
          - property: descriptionSource
            value: backend:scripts/seed/views/v_pcx_30_patient_list.sql.tmpl
      - name: organization_name
        description: Name of the contributing institution (v_pcx_30_demographics_combined).
        customProperties:
          - property: descriptionSource
            value: backend:scripts/seed/views/v_pcx_30_patient_list.sql.tmpl
      - name: patient_id
        description: The patient's identifier as this caller may see it (MRN with PHI access, research id
          without), from v_pcx_30_demographics_combined. Never select or show it.
        customProperties:
          - property: descriptionSource
            value: backend:scripts/seed/views/v_pcx_30_patient_list.sql.tmpl
      - name: patient_id_type
        description: "'mrn' or 'research_id': the namespace of patient_id on this row."
        examples:
          - mrn
          - research_id
        customProperties:
          - property: descriptionSource
            value: backend:scripts/seed/views/v_pcx_30_patient_list.sql.tmpl
      - name: radiant_patient_id
        description: Portal patient id (radiant_jdbc.public.patient.id), not masked; NULL when the patient has no
          portal record. Key of case_count.
        customProperties:
          - property: descriptionSource
            value: backend:scripts/seed/views/v_pcx_30_patient_list.sql.tmpl; mcp:radiant_mcp/schema_catalog.py
      - name: given_name
        description: First name from v_pcx_30_demographics_combined, the real one with PHI access, else the
          placeholder '<research_id>_given_name'.
        customProperties:
          - property: descriptionSource
            value: backend:scripts/seed/views/v_pcx_30_patient_list.sql.tmpl; backend:scripts/pcx_tables/access_controlled_views/demographics_access_controlled.sql.tmpl
      - name: family_name
        description: Last name from v_pcx_30_demographics_combined, the real one with PHI access, else the
          placeholder '<research_id>_family_name'.
        customProperties:
          - property: descriptionSource
            value: backend:scripts/seed/views/v_pcx_30_patient_list.sql.tmpl; backend:scripts/pcx_tables/access_controlled_views/demographics_access_controlled.sql.tmpl
      - name: birth_year
        description: Year of birth, CAST(birth_year AS INT).
        customProperties:
          - property: descriptionSource
            value: backend:scripts/seed/views/v_pcx_30_patient_list.sql.tmpl
      - name: gender
        description: API code of the administrative sex, replace(lower(gender), ' ', '_').
        examples:
          - not_reported
        customProperties:
          - property: descriptionSource
            value: backend:scripts/seed/views/v_pcx_30_patient_list.sql.tmpl
      - name: diagnosis_type_cohort
        description: Diagnosis cohort of the row (v_pcx_30_demographics_combined).
        examples:
          - Medulloblastoma
          - Atypical teratoid/rhabdoid tumor
        customProperties:
          - property: descriptionSource
            value: backend:scripts/seed/views/v_pcx_30_patient_list.sql.tmpl; backend:scripts/pcx_tables/starrocks-dbt/starrocks_radiant/models/pcx_30/combined/v_pcx_30_demographics_combined.sql
      - name: data_type_cohort
        description: "'radiant' or 'cbtn-non-radiant' (v_pcx_30_demographics_combined)."
        examples:
          - radiant
          - cbtn-non-radiant
        customProperties:
          - property: descriptionSource
            value: backend:scripts/seed/views/v_pcx_30_patient_list.sql.tmpl
      - name: cns_integrated_diagnosis
        description: CNS integrated diagnosis of the patient's initial event, the 'Initial CNS Tumor' row of
          v_pcx_30_event_level_combined with the smallest known age (-1 sorts last, ties by diagnosis).
        customProperties:
          - property: descriptionSource
            value: backend:scripts/seed/views/v_pcx_30_patient_list.sql.tmpl
      - name: cns_integrated_diagnosis_source
        description: "Source of cns_integrated_diagnosis on that same initial event: 'CBTN' or 'OpenPedCan'."
        examples:
          - CBTN
          - OpenPedCan
        customProperties:
          - property: descriptionSource
            value: backend:scripts/seed/views/v_pcx_30_patient_list.sql.tmpl
      - name: vital_status
        description: lower(vital_status) of v_pcx_30_patient_level_combined.
        examples:
          - alive
          - deceased
        customProperties:
          - property: descriptionSource
            value: backend:scripts/seed/views/v_pcx_30_patient_list.sql.tmpl; mcp:radiant_mcp/schema_catalog.py
      - name: age_at_vital_status_days
        description: Age in days at the most recent known vital status, CAST(... AS INT) of
          v_pcx_30_patient_level_combined; NULL when unknown.
        customProperties:
          - property: descriptionSource
            value: backend:scripts/seed/views/v_pcx_30_patient_list.sql.tmpl
      - name: age_at_initial_dx_days
        description: Age in days at the initial diagnosis, the treatment summary's age_at_initial_dx_days when >= 0,
          else the age of the initial event above when >= 0; NULL when both are unknown.
        customProperties:
          - property: descriptionSource
            value: backend:scripts/seed/views/v_pcx_30_patient_list.sql.tmpl
      - name: survival_days
        description: age_at_vital_status_days - age_at_initial_dx_days, the days from initial diagnosis to the
          vital status; NULL unless both ages are known.
        customProperties:
          - property: descriptionSource
            value: backend:scripts/seed/views/v_pcx_30_patient_list.sql.tmpl; mcp:radiant_mcp/schema_catalog.py
      - name: has_imaging
        description: TRUE when the patient has at least one row in v_pcx_30_mri_images_combined.
        customProperties:
          - property: descriptionSource
            value: backend:scripts/seed/views/v_pcx_30_patient_list.sql.tmpl
      - name: case_count
        description: Number of distinct Radiant cases of radiant_patient_id, as proband (cases.proband_id) or family
          member (family.family_member_id); 0 when none.
        customProperties:
          - property: descriptionSource
            value: backend:scripts/seed/views/v_pcx_30_patient_list.sql.tmpl
      - name: got_radiation_ever
        description: TRUE when the patient has any row in v_pcx_30_radiation_level_combined, whatever its content.
        customProperties:
          - property: descriptionSource
            value: backend:scripts/seed/views/v_pcx_30_patient_list.sql.tmpl
      - name: chemotherapy_agents
        description: "Array of the distinct agents of all the patient's regimens: chemotherapy_agents of
          v_pcx_30_medical_therapy_level_combined split on commas, trimmed and lowercased, without '', 'not
          reported', 'not applicable' and 'not available'. NULL when none."
        customProperties:
          - property: descriptionSource
            value: backend:scripts/seed/views/v_pcx_30_patient_list.sql.tmpl
      - name: can_read_phi
        description: can_read_phi of the patient's v_pcx_30_demographics_combined row (org grant or lab grant of
          the caller).
        customProperties:
          - property: descriptionSource
            value: backend:scripts/seed/views/v_pcx_30_patient_list.sql.tmpl; backend:scripts/pcx_tables/access_controlled_views/demographics_access_controlled.sql.tmpl
    customProperties:
      - property: consumers
        value:
          - backend/internal/repository/starrocks/pcx_patients.go
          - backend/internal/types/pcx_patient_query.go
          - mcp/radiant_mcp/queries/patients.py
          - mcp/radiant_mcp/schema_catalog.py
authoritativeDefinitions:
  - type: implementation
    url: backend:scripts/seed/views/v_pcx_30_patient_list.sql.tmpl
