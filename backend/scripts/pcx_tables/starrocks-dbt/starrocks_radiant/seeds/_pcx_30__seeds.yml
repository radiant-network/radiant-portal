version: 2

seeds:
  - name: pcx_30_organization_ref
    description: >
      Organization code/name reference for the pcx_30 views. Non-PHI -- public
      institution names and short codes.

      WHY A SEED, NOT A VIEW: the canonical source is radiant_jdbc.public.organization
      (surfaced as radiant_tenant.organization). The QA cluster returns 41 rows. When
      this seed was written, that JDBC source in PROD held only 1 row (chusj / CHU
      Ste-Justine) and cbtn_tenant.organization returned 0 -- so prod had nothing to
      join to. The first 41 rows were seeded from QA as of 2026-09-24, and verified
      unchanged in prod on 2026-10-12 before this seed replaced the hand-written INSERT.

      PROD'S SOURCE IS NOW POPULATED (51 rows, observed 2026-10-23) AND YOU STILL MUST
      NOT SWAP THIS SEED FOR A MODEL OVER IT. Earlier drafts of this note said to do
      exactly that once prod filled in. Measured against live prod 2026-10-23, the swap
      LOSES more than it gains, because stg_cbtn_enrollment_final.organization_name --
      the only join key -- carries the QA spellings, not the canonical ones:

        gained:  NYU Langone Health (9 enrollment rows)
        LOST:    Children's National Medical Center (CNMC)  693 rows  (canonical drops
                 the " (CNMC)" suffix)
                 CBTN Non-Consortium Member                 142 rows  (absent upstream)
                 UAB                                         36 rows  (canonical says
                 "University of Alabama at Bermingham")
                 Children's Hospital of Atlanta (CHOA)       23 rows  (suffix dropped)

      894 enrollment rows would fall to a NULL organization_code -- which fails CLOSED,
      so those patients would go permanently de-identified even for a granted caller,
      silently. Also absent upstream entirely: PNOC, NA, and the seed's O/Oligo (prod
      has ON/Oligo Nation). Treat the canonical table as the source of CODES, and
      stg_cbtn_enrollment_final as the source of NAMES.

      APOSTROPHE TRAP when copying a name from the canonical source. It uses U+2019
      (RIGHT SINGLE QUOTATION MARK, hex E28099) in "Children's Hospital Los Angeles" and
      "Nicklaus Children's Hospital"; stg_cbtn_enrollment_final uses the ASCII
      apostrophe (hex 27), as does every row of this seed. The join is exact equality,
      so a verbatim copy-paste of the canonical name matches ZERO rows while looking
      correct in any terminal. Always re-derive the name from the enrollment table.

      2026-10-23: three rows added -- CHLA, NYULH, Nicklaus. Codes taken from the
      canonical prod table (all three already hold auth.pii_grant rows, so these
      patients become reachable for a granted caller rather than failing closed);
      names taken from stg_cbtn_enrollment_final with the ASCII apostrophe. tenant_code
      is 'radiant' to match the existing 41 rows -- the canonical table says 'cbtn' for
      all 50 of its real orgs, but nothing downstream reads this column, so internal
      consistency wins over matching a source nobody joins to.

      One enrollment organization_name is STILL unmatched after this change: "Zurich
      Children's Hospital" (4 enrollment rows, 0 of them in the ATRT/Medulloblastoma
      release cohort). It has no row in the canonical prod table and no auth.pii_grant,
      so no code exists for it anywhere -- inventing one here would be a guess.

      name and code are both unique across all 44 rows (verified on prod 2026-10-23:
      44 rows, 44 distinct codes, 44 distinct names), so the LEFT JOIN in every pcx_30
      combined view cannot fan out.
    config:
      column_types:
        code: VARCHAR(64)
        name: VARCHAR(256)
        category_code: VARCHAR(64)
        tenant_code: VARCHAR(64)
    columns:
      - name: code
        description: "Organization short code; the value projected as organization_code."
      - name: name
        description: "Organization display name; join key to pcx_30 organization_name."
      - name: category_code
        description: "healthcare_provider | sequencing_center"
      - name: tenant_code
        description: "Source tenant filter."

  - name: pcx_30_data_dictionary_src
    description: >
      AUTHORED SOURCE of the pcx_30 release data dictionary -- 74 rows of
      hand-written field and table descriptions for the seven pcx_30_*_deid release
      tables. Edit THIS FILE to change the dictionary.

      WHY A SEED: the retired data_dictionary_table.sql held these same 74 rows as a
      19 KB INSERT ... VALUES block, and its own column comment described
      display_order as "authored row order from data_dictionary.csv" -- i.e. the SQL
      was a hand transcription of a CSV that already existed
      (prelim_30_deid_tables/data_dictionary.csv, also 74 records). Seeding removes
      the transcription step. It also removes the escaping burden: 33 of the 74
      descriptions contain an apostrophe, which needed '' doubling in SQL and needs
      nothing at all in CSV, and 26 contain a comma, which CSV quoting handles
      mechanically.

      FOUR COLUMNS, NOT FIVE. The published table also carries table_name, which is
      always source_file minus the '.csv' suffix (verified on all 74 rows). It is
      DERIVED in the pcx_30_data_dictionary model rather than seeded, so the two can
      never disagree.

      display_order IS SEEDED, NOT DERIVED, and must be: a loaded table has no
      inherent row order, so "authored CSV order" cannot be reconstructed after
      load -- and both read views instruct consumers to ORDER BY it. When inserting a
      row mid-list, renumber.

      field_name is EMPTY for the 7 table-level rows (one per documented table). That
      empty value is SEMANTIC -- it means "this row describes the table, not a
      field" -- and the pcx_30_data_dictionary model coerces it to NULL with
      nullif(), so an empty-string load cannot silently destroy the distinction.

      Contains NO patient data: field names and prose descriptions only.
    config:
      column_types:
        display_order: INT
        source_file: VARCHAR(128)
        field_name: VARCHAR(128)
        description: VARCHAR(2000)
    columns:
      - name: display_order
        description: "Authored row order. ORDER BY this to reproduce the published CSV order."
      - name: source_file
        description: "Original CSV filename of the release table being described."
      - name: field_name
        description: "Field described. EMPTY (-> NULL downstream) means the row describes the table itself."
      - name: description
        description: "Field or table description as published."
