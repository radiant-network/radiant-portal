version: 2

seeds:
  - name: pcx_30_organization_ref
    description: >
      Organization code/name reference for the pcx_30 views. Non-PHI -- public
      institution names and short codes. 45 rows.

      WHY A SEED: the canonical source is radiant_jdbc.public.organization. 41 rows
      were seeded from QA 2026-09-24 and verified in prod 2026-10-12; BCH was
      corrected to Boston Children's and UCSF Benioff moved to UCSF-BCH on
      2026-10-29 (42); CHLA, NYULH and Nicklaus were added from live prod on
      2026-11-03, with BCH and UCSF-BCH tenant_code corrected 'radiant' -> 'cbtn'
      to match (45). CHLA is the enrolling institution for a patient carrying a
      PNOC035 eligibility verdict; without it that patient's organization_code
      resolves to NULL.

      AT EXACT PARITY WITH LIVE PROD as of 2026-11-03, verified field-by-field.
      That is the point: `dbt seed` -- and any `dbt build`, which runs seeds --
      OVERWRITES the live table, so parity is what makes those safe. Before the
      reconciliation, seeding would have DELETED three rows and reverted two
      tenant_codes. Diff this file against the live table before running either,
      and treat any difference as a question rather than something to seed over.

      The tenant_code flips are inert for this repo: grepped across every combined
      view, access-controlled view and dbt model, NO consumer reads
      organization_ref.tenant_code. Those views join on .name and project .code,
      and the 'cbtn' filter in 13 of the templates applies to
      radiant_jdbc.public.patient.tenant_code -- a different column on a different
      table. An earlier draft called this difference access-control-sensitive;
      that was wrong, and is recorded because the BCH/UCSF-BCH pair has already
      caused one real access-control bug via the name/code conflation.

      THE "PROD HAS NOTHING TO JOIN TO" PREMISE HAS EXPIRED. Re-measured
      2026-11-03: radiant_jdbc.public.organization holds 52 rows and
      cbtn_tenant.organization 51; only radiant_tenant.organization is still the
      single chusj row. So the retirement condition is met on paper, but a swap is
      NOT safe -- 39 shared codes disagree on tenant_code, 4 codes here are absent
      upstream (CNM, NA, O, PNOC, apparent pcx_30-local sentinels that would be
      dropped), and 10 upstream codes are absent here. That needs a decision, not
      a rename.

      WHEN SETTLED, replace this seed with a model:
        select code, name, category_code, tenant_code from radiant_tenant.organization
      Dependents reference only .name and .code, so they need no change.

      name and code are both unique across all 45 rows (verified), so the LEFT JOIN
      in every pcx_30 combined view cannot fan out.

      ADDING AN ORGANIZATION IS A REQUEST TO THE PORTAL / CHU STE-JUSTINE OWNERS
      FIRST -- they maintain the list outside dbt and outside this repo; this seed
      is a stop-gap copy. The three rows added in 2026-11-03 were copied from live
      prod, not authored here.
    config:
      column_types:
        code: VARCHAR(64)
        name: VARCHAR(256)
        category_code: VARCHAR(64)
        tenant_code: VARCHAR(64)
    columns:
      - name: code
        description: "Organization short code; the value projected as organization_code."
      - name: name
        description: "Organization display name; join key to pcx_30 organization_name."
      - name: category_code
        description: "healthcare_provider | sequencing_center"
      - name: tenant_code
        description: "Source tenant filter."

  - name: pcx_30_data_dictionary_src
    description: >
      AUTHORED SOURCE of the pcx_30 release data dictionary -- 74 rows of
      hand-written field and table descriptions for the seven pcx_30_*_deid release
      tables. Edit THIS FILE to change the dictionary.

      WHY A SEED: the retired data_dictionary_table.sql held these same 74 rows as a
      19 KB INSERT ... VALUES block, and its own column comment described
      display_order as "authored row order from data_dictionary.csv" -- i.e. the SQL
      was a hand transcription of a CSV that already existed
      (prelim_30_deid_tables/data_dictionary.csv, also 74 records). Seeding removes
      the transcription step. It also removes the escaping burden: 33 of the 74
      descriptions contain an apostrophe, which needed '' doubling in SQL and needs
      nothing at all in CSV, and 26 contain a comma, which CSV quoting handles
      mechanically.

      FOUR COLUMNS, NOT FIVE. The published table also carries table_name, which is
      always source_file minus the '.csv' suffix (verified on all 74 rows). It is
      DERIVED in the pcx_30_data_dictionary model rather than seeded, so the two can
      never disagree.

      display_order IS SEEDED, NOT DERIVED, and must be: a loaded table has no
      inherent row order, so "authored CSV order" cannot be reconstructed after
      load -- and both read views instruct consumers to ORDER BY it. When inserting a
      row mid-list, renumber.

      field_name is EMPTY for the 7 table-level rows (one per documented table). That
      empty value is SEMANTIC -- it means "this row describes the table, not a
      field" -- and the pcx_30_data_dictionary model coerces it to NULL with
      nullif(), so an empty-string load cannot silently destroy the distinction.

      Contains NO patient data: field names and prose descriptions only.
    config:
      column_types:
        display_order: INT
        source_file: VARCHAR(128)
        field_name: VARCHAR(128)
        description: VARCHAR(2000)
    columns:
      - name: display_order
        description: "Authored row order. ORDER BY this to reproduce the published CSV order."
      - name: source_file
        description: "Original CSV filename of the release table being described."
      - name: field_name
        description: "Field described. EMPTY (-> NULL downstream) means the row describes the table itself."
      - name: description
        description: "Field or table description as published."
