  - TWO AGE SCALES, both published. age_at_first_*_ever_days is the first course EVER; age_at_initial_*_days
    is the first course that is INITIAL (frontline) treatment. They differ, and the had_initial_*
    flags and initial_treatment_order are computed from the latter.
  - age_at_initial_dx_days and age_at_first_event_days pass the -1 UNKNOWN-DATE SENTINEL through
    deliberately, unlike the per-row treatment tables which guard against it.
  - age_at_first_event_days has no '_ever_' infix because it is a DISEASE EVENT, not a treatment.
