# scenarios/cases_sequencing_requests.toml
#
# The order-time payload: QLIN emits the sequencing ServiceRequests when the clinician orders
# them, so the case arrives with requests and with no sequencing_experiments and no tasks at all.
# That is the state that had no representation in Radiant before the sequencing_request table.
#
# service_code values are the MSSS codes of the FHIR CodeSystem sequencing-request-code seeded by
# migration 000022: 75022 is genome, 75020 is exome.

