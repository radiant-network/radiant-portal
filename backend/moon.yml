language: 'go'
layer: 'application'
stack: 'backend'

# The backend reads tables the ETL owns (StarRocks schema).
dependsOn: ['etl']

fileGroups:
  sources: ['**/*.go', 'go.mod', 'go.sum']
  # Published to the frontend (TS client) and the MCP (radiant_python client).
  openapi: ['docs/swagger.yaml']
  # What the backend publishes in each tenant database (views): hand-edited contracts, read by the MCP.
  contracts: ['contracts/starrocks/**/*']
  # What `go run ./cmd/contracts` reads: its Go packages (go list -deps ./cmd/contracts), the migrations
  # it applies to a throwaway Postgres, and the PCX view SQL.
  contract-sources:
    - 'go.mod'
    - 'go.sum'
    - 'cmd/contracts/*.go'
    - 'internal/types/*.go'
    - 'internal/utils/**/*.go'
    - 'internal/observability/*.go'
    - 'internal/database/*.go'
    - 'internal/client/*.go'
    - 'internal/repository/postgres/*.go'
    - 'internal/repository/starrocks/*.go'
    - 'internal/repository/starrocks/views/*'
    - 'scripts/init-sql/migrations/**/*'
    - 'scripts/seed/views/**/*'
    - 'scripts/pcx_tables/access_controlled_views/**/*'
    - '!**/*_test.go'
  # API filter/sort field lists, still parsed by the MCP tests (belongs in swagger.yaml, later).
  api-fields: ['internal/types/**/*.go']

tasks:
  build:
    command: 'go build ./...'
    inputs: ['@group(sources)']
  test:
    # Same selection as backend.yml: everything except internal/repository (testcontainers).
    script: 'go test -timeout 30m $(go list ./... | grep -v ./internal/repository)'
    inputs: ['@group(sources)', 'test/**/*']
    deps: ['build']

  # ---- Data contracts of the tenant views: hand-edited by the backend (descriptions, the columns it publishes).
  # Needs Docker (a throwaway Postgres for the migrations), or -dsn of a migrated Postgres.
  # Scaffold the contract of a new view (never overwrites one): moon run backend:contracts-scaffold -- <view>
  contracts-scaffold:
    command: 'go run ./cmd/contracts'
    inputs: ['@group(contract-sources)']
    options:
      cache: false
      runInCI: false
  # Every contracted view, column and type still exists in the views the code creates.
  contracts-check:
    command: 'go run ./cmd/contracts -check'
    inputs: ['@group(contract-sources)', '@group(contracts)']
  contracts-breaking:
    command: 'uv run -q --no-project --with pyyaml==6.0.2 python $workspaceRoot/scripts/contracts-breaking.py contracts'
    inputs: ['@group(contracts)', '/scripts/contracts-breaking.py']
    options:
      cache: false  # compares with $CONTRACTS_BASE (default main), not an input

  # ---- Docker images. Inputs generated by scripts/go-image-inputs.py (go list -deps): rerun it when imports change.
  docker-api:
    tags: ['docker']
    command: '$workspaceRoot/scripts/docker.sh radiant-api api.Dockerfile .'
    inputs:
      - 'api.Dockerfile'
      - '.dockerignore'
      - 'go.mod'
      - 'go.sum'
      - 'cmd/api/*.go'
      - 'internal/authorization/*.go'
      - 'internal/cli/manifest/*.go'
      - 'internal/client/*.go'
      - 'internal/database/*.go'
      - 'internal/notification/*.go'
      - 'internal/observability/*.go'
      - 'internal/provisioning/*.go'
      - 'internal/report/*.go'
      - 'internal/report/transcripts_radiant.json'
      - 'internal/repository/postgres/*.go'
      - 'internal/repository/starrocks/*.go'
      - 'internal/repository/starrocks/views/auth_pii_grant.sql'
      - 'internal/repository/starrocks/views/auth_pii_lab_patient.sql'
      - 'internal/repository/starrocks/views/patient.sql.tmpl'
      - 'internal/server/*.go'
      - 'internal/service/*.go'
      - 'internal/types/*.go'
      - 'internal/utils/*.go'
      - 'internal/utils/joins/*.go'
      - 'scripts/init-sql/migrations/**/*'
      - '!**/*_test.go'
    deps: ['test']
    options:
      runInCI: 'affected'
      cache: false  # side effect (push): never replay from moon's cache
  docker-worker:
    tags: ['docker']
    command: '$workspaceRoot/scripts/docker.sh radiant-worker worker.Dockerfile .'
    inputs:
      - 'worker.Dockerfile'
      - '.dockerignore'
      - 'go.mod'
      - 'go.sum'
      - 'cmd/worker/*.go'
      - 'internal/batchval/*.go'
      - 'internal/client/*.go'
      - 'internal/database/*.go'
      - 'internal/observability/*.go'
      - 'internal/repository/postgres/*.go'
      - 'internal/types/*.go'
      - 'internal/utils/*.go'
      - 'internal/utils/joins/*.go'
      - '!**/*_test.go'
    deps: ['test']
    options:
      runInCI: 'affected'
      cache: false  # side effect (push): never replay from moon's cache
  docker-mysql-proxy:
    tags: ['docker']
    command: '$workspaceRoot/scripts/docker.sh radiant-mysql-proxy mysql-proxy.Dockerfile .'
    inputs:
      - 'mysql-proxy.Dockerfile'
      - '.dockerignore'
      - 'go.mod'
      - 'go.sum'
      - 'cmd/mysql-proxy/*.go'
      - 'internal/mysqlproxy/*.go'
      - '!**/*_test.go'
    deps: ['test']
    options:
      runInCI: 'affected'
      cache: false  # side effect (push): never replay from moon's cache
  docker-mysql-gateway:
    tags: ['docker']
    command: '$workspaceRoot/scripts/docker.sh radiant-mysql-gateway mysql-gateway.Dockerfile .'
    inputs:
      - 'mysql-gateway.Dockerfile'
      - '.dockerignore'
      - 'go.mod'
      - 'go.sum'
      - 'cmd/mysql-gateway/*.go'
      - 'internal/client/*.go'
      - 'internal/mysqlproxy/*.go'
      - 'internal/types/*.go'
      - '!**/*_test.go'
    deps: ['test']
    options:
      runInCI: 'affected'
      cache: false  # side effect (push): never replay from moon's cache
  docker-toolbox:
    tags: ['docker']
    command: '$workspaceRoot/scripts/docker.sh radiant-toolbox toolbox.Dockerfile .'
    inputs:
      - 'toolbox.Dockerfile'
      - '.dockerignore'
      - 'go.mod'
      - 'go.sum'
      - 'cmd/bootstrap-admin-policies/*.go'
      - 'cmd/create-tenant/*.go'
      - 'cmd/create-user/*.go'
      - 'cmd/refresh-tenants/*.go'
      - 'internal/client/*.go'
      - 'internal/database/*.go'
      - 'internal/observability/*.go'
      - 'internal/provisioning/*.go'
      - 'internal/repository/postgres/*.go'
      - 'internal/repository/starrocks/*.go'
      - 'internal/repository/starrocks/views/auth_pii_grant.sql'
      - 'internal/repository/starrocks/views/auth_pii_lab_patient.sql'
      - 'internal/repository/starrocks/views/patient.sql.tmpl'
      - 'internal/service/*.go'
      - 'internal/types/*.go'
      - 'internal/utils/*.go'
      - 'internal/utils/joins/*.go'
      - '!**/*_test.go'
    deps: ['test']
    options:
      runInCI: 'affected'
      cache: false  # side effect (push): never replay from moon's cache
